# Datasource config. La EC2 ya escribe uno equivalente en su userdata; este
# archivo está en repo por si querés provisionar manualmente o re-aplicar.
# El password debe inyectarse al copiar (NO commitear el password real).
apiVersion: 1

datasources:
  - name: PeopleCounter
    # UID fijo para que los dashboards puedan referenciarlo. Si se omite,
    # Grafana asigna uno aleatorio y los dashboards (que esperan
    # people-counter-pg) no encuentran el datasource.
    uid: people-counter-pg
    type: postgres
    url: localhost:5432
    user: people_counter
    isDefault: true
    jsonData:
      # Grafana 11+ movió "database" desde top-level a jsonData. En versiones
      # viejas era 'database: people_counter' como key raíz.
      database: people_counter
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    # secureJsonData.password se inyecta del SSM Parameter Store en el userdata.
