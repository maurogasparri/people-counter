AWSTemplateFormatVersion: "2010-09-09"
Description: >
  People Counter - Cloud infrastructure.
  IoT Core (3 rules) -> Lambda persist_event -> RDS Postgres.
  Grafana en ECS Fargate + ALB + ACM cert (custom domain HTTPS,
  imagen desde ECR privado). El cert se crea fuera de CFN por
  deploy.ps1 (aws acm request-certificate) y entra al stack por
  parametro para no bloquear el deploy esperando DNS validation.
  Lambda usa IAM database auth contra RDS (sin password en runtime).
  RDS publicly accessible con SG IP-allowlist para DBeaver desde admin.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Sufijo de naming para todos los resources.

  DomainName:
    Type: String
    Default: <tu-dominio>
    Description: >-
      Dominio raiz para custom domains (Grafana y API). El default es un
      marcador: hay que pasar el dominio propio al desplegar (infra/deploy.ps1
      lo envia con -DomainName). El valor real no se versiona.

  GrafanaSubdomain:
    Type: String
    Default: grafana
    Description: Subdominio para Grafana. URL final = <sub>.<domain>.

  AlertEmail:
    Type: String
    Default: mauro@gasparri.com.ar
    Description: Email para suscribir al SNS de alertas (CloudWatch alarms).
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

  RdsInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t4g.large]
    Description: Instance class del RDS. t4g.micro para PoC/Piloto.

  RdsAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: GB iniciales (gp3). Autoscale hasta MaxAllocatedStorage.

  RdsMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 16384
    Description: Tope del autoscale de storage.

  RdsMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Multi-AZ para produccion HA. PoC = false.

  RdsBackupRetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 35
    Description: Dias de retencion de backups. 0=disabled (dev). Free tier max 1.

  GrafanaImageTag:
    Type: String
    Default: latest
    Description: >
      Tag de la imagen Grafana en ECR privado (people-counter/grafana).
      Push manual desde Docker Hub antes del segundo deploy:
        docker pull grafana/grafana:latest
        docker tag  grafana/grafana:latest <ecr-uri>:<tag>
        docker push <ecr-uri>:<tag>

  # Sizing del task Fargate para Grafana OSS. 512 CPU + 1024 MB cubre a 1-2
  # usuarios concurrentes leyendo dashboards. Valid Fargate combinations:
  # https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html
  GrafanaCpu:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 2048, 4096]
    Description: vCPU del task Fargate (256 = 0.25 vCPU).

  GrafanaMemory:
    Type: Number
    Default: 2048
    AllowedValues: [512, 1024, 2048, 3072, 4096, 5120, 6144, 7168, 8192]
    Description: Memoria del task Fargate en MiB (2048 = Grafana + sidecar image-renderer/Chromium).

  GrafanaCertArn:
    Type: String
    Default: ""
    Description: >
      ARN del cert ACM (ya validado) que el ALB usa para HTTPS. Creado
      fuera de CFN por deploy.ps1 (aws acm request-certificate) para
      evitar que el deploy bloquee esperando validacion DNS. Vacio en
      el primer deploy (DeployGrafana=false); seteado en el segundo.

  ApiCertArn:
    Type: String
    Default: ""
    Description: >
      ARN del cert ACM regional (us-east-1) para el custom domain de la
      POS API (api.<DomainName>). Creado fuera de CFN igual que el de
      Grafana. Vacio = la API queda solo en la URL execute-api default.

  DeployGrafana:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Set a "true" en el segundo deploy, DESPUES de pushear la imagen
      Grafana a ECR y de tener el cert ACM validado. Default "false"
      permite primer deploy sin error de imagen inexistente / cert
      faltante.

Conditions:

  DeployGrafanaCondition:
    !Equals [!Ref DeployGrafana, "true"]

  IsMultiAZ:
    !Equals [!Ref RdsMultiAZ, "true"]

  HasApiCustomDomain:
    !Not [!Equals [!Ref ApiCertArn, ""]]

Resources:

  # =========================================================================
  # Networking — VPC + 2 public subnets + IGW.
  # Subnets son "public" en sentido routing (tienen route a IGW). RDS está
  # PubliclyAccessible via AWS DNS. ECS Fargate tasks corren en estas
  # subnets con AssignPublicIp=ENABLED (no requiere NAT/VPC endpoint).
  # El ALB tambien vive aca (internet-facing).
  # =========================================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: !Sub "people-counter-vpc-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub "people-counter-igw-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "people-counter-public-1-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "people-counter-public-2-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "people-counter-public-rt-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # =========================================================================
  # IoT Core — policy + thing type + 3 rules (counting / telemetry / wifi_ble)
  # =========================================================================

  IoTDevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub "people-counter-device-policy-${Environment}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [iot:Connect]
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}"
          - Effect: Allow
            Action: [iot:Publish]
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/counting"
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/wifi_ble"
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/telemetry"
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/*"
          - Effect: Allow
            Action: [iot:Subscribe]
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/*"
          - Effect: Allow
            Action: [iot:Receive]
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/*"

  IoTThingType:
    Type: AWS::IoT::ThingType
    Properties:
      ThingTypeName: !Sub "people-counter-${Environment}"
      ThingTypeProperties:
        ThingTypeDescription: People Counter edge device (RPi5 + Hailo-8L)
        SearchableAttributes: [store_id, firmware_version]
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  IoTRuleErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/iot/people-counter-rule-errors-${Environment}"
      RetentionInDays: 14

  IoTRuleErrorLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "people-counter-iot-rule-error-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: iot.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-error-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IoTRuleErrorLogGroup.Arn

  IoTRuleCounting:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "people_counter_counting_${Environment}"
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/counting'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PersistEventLambda.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleErrorLogRole.Arn

  IoTRuleTelemetry:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "people_counter_telemetry_${Environment}"
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/telemetry'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PersistEventLambda.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleErrorLogRole.Arn

  IoTRuleWifiBle:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "people_counter_wifi_ble_${Environment}"
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/wifi_ble'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PersistEventLambda.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleErrorLogRole.Arn

  # =========================================================================
  # RDS Postgres — Multi-AZ optional, IAM auth ON, TLS forzado
  # =========================================================================

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Postgres - ingress 5432 publico (auth IAM/password + TLS forzado)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # 5432 abierto a internet: el Lambda corre out-of-VPC (egress IP no
        # fija) y DBeaver/psql admin conectan por el endpoint publico. La
        # seguridad es IAM auth (Lambda, sin password) + master password
        # random de 32 chars (admin) + force_ssl=1. Un IP-allowlist seria
        # redundante mientras esta regla 0.0.0.0/0 exista. Para produccion:
        # mover Lambda a la VPC y restringir 5432 al SG del Lambda/ECS.
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: "5432 publico - Lambda IAM auth + admin master password, TLS forzado"
      Tags:
        - {Key: Name, Value: !Sub "people-counter-rds-sg-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "people-counter-rds-subnets-${Environment}"
      DBSubnetGroupDescription: Subnets para RDS Postgres (publicas para PubliclyAccessible)
      SubnetIds: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  RdsParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: "Postgres 16 - TLS forzado + logging para debug + pg_cron"
      Parameters:
        rds.force_ssl: "1"
        log_min_duration_statement: "1000"
        log_connections: "1"
        log_disconnections: "1"
        log_lock_waits: "1"
        # pg_cron: agenda el refresh incremental de los rollups (CALL refresh_rollups()).
        # shared_preload_libraries es estático → cambiarlo requiere reboot del instance.
        # cron.database_name apunta pg_cron a la DB de la app (no a 'postgres').
        shared_preload_libraries: "pg_cron"
        cron.database_name: "people_counter"
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  RdsMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "people-counter/${Environment}/rds-master"
      Description: RDS master password (people_counter user). Auto-generado.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"people_counter"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\$''`'
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "people-counter-${Environment}"
      Engine: postgres
      # 16.6+ por EOL de 16.4 (oct 2025). AutoMinorVersionUpgrade=true para
      # que RDS aplique futuros minor patches dentro de la maintenance window
      # sin requerir CFN update manual.
      EngineVersion: "16.6"
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref RdsInstanceClass
      AllocatedStorage: !Ref RdsAllocatedStorage
      MaxAllocatedStorage: !Ref RdsMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: people_counter
      MasterUsername: !Sub '{{resolve:secretsmanager:${RdsMasterSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RdsMasterSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups: [!GetAtt RdsSecurityGroup.GroupId]
      DBParameterGroupName: !Ref RdsParameterGroup
      PubliclyAccessible: true
      MultiAZ: !If [IsMultiAZ, true, false]
      BackupRetentionPeriod: !Ref RdsBackupRetentionDays
      PreferredBackupWindow: "03:00-04:00"          # UTC = 00:00-01:00 AR
      PreferredMaintenanceWindow: "sun:04:00-sun:05:00"  # UTC = sun 01:00-02:00 AR
      EnableIAMDatabaseAuthentication: true
      EnablePerformanceInsights: false  # subir a true cuando llegue prod
      DeletionProtection: false  # subir a true cuando llegue prod
      EnableCloudwatchLogsExports: [postgresql]
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  # =========================================================================
  # Lambda persist_event — IoT Rules → RDS Postgres (vía IAM auth)
  # =========================================================================

  PersistEventLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "people-counter-persist-event-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rds-iam-auth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Generar token de auth IAM contra el user "lambda_writer".
              # El user de Postgres se crea en el SQL de bootstrap post-deploy.
              - Effect: Allow
                Action: [rds-db:connect]
                Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RdsInstance.DbiResourceId}/lambda_writer"

  PersistEventLambda:
    Type: AWS::Lambda::Function
    DependsOn: PersistEventLambdaLogGroup
    Properties:
      FunctionName: !Sub "people-counter-persist-event-${Environment}"
      Runtime: python3.13
      Handler: persist_event.handler
      Role: !GetAtt PersistEventLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PG_HOST: !GetAtt RdsInstance.Endpoint.Address
          PG_PORT: !GetAtt RdsInstance.Endpoint.Port
          PG_DB: people_counter
          PG_USER: lambda_writer
          PG_REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          # Placeholder — el código real está en src/cloud/persist_event.py
          # y se sube con scripts/deploy_lambda.sh
          # La Lambda real autentica vía rds.generate-db-auth-token (IAM auth)
          # y conecta con psycopg sobre TLS al RDS.
          def handler(event, context):
              import json
              print(json.dumps({"received": event}))
              return {"statusCode": 501, "body": "Deploy real persist_event.py + psycopg layer"}
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  PersistEventLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/people-counter-persist-event-${Environment}"
      RetentionInDays: 14

  PersistEventLambdaPermissionCounting:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PersistEventLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/people_counter_counting_${Environment}"

  PersistEventLambdaPermissionTelemetry:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PersistEventLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/people_counter_telemetry_${Environment}"

  PersistEventLambdaPermissionWifiBle:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PersistEventLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/people_counter_wifi_ble_${Environment}"

  # =========================================================================
  # Ingest POS — API Gateway HTTP API v2 + Lambda con IAM auth (T9.11, US-06)
  # =========================================================================
  # POST /pos/transactions — el POS firma con SigV4 contra un IAM principal
  # autorizado. Body acepta {tx} o [{tx1}, {tx2}, ...]. Lambda valida +
  # inserta con ON CONFLICT (store_id, transaction_id) DO NOTHING.

  IngestPosLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "people-counter-ingest-pos-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rds-iam-auth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # User Postgres separado del lambda_writer (least privilege:
              # solo INSERT/SELECT sobre pos_transactions). Creado por SQL bootstrap.
              - Effect: Allow
                Action: [rds-db:connect]
                Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RdsInstance.DbiResourceId}/lambda_pos_writer"

  IngestPosLambda:
    Type: AWS::Lambda::Function
    DependsOn: IngestPosLambdaLogGroup
    Properties:
      FunctionName: !Sub "people-counter-ingest-pos-${Environment}"
      Runtime: python3.13
      Handler: ingest_pos_transaction.handler
      Role: !GetAtt IngestPosLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PG_HOST: !GetAtt RdsInstance.Endpoint.Address
          PG_PORT: !GetAtt RdsInstance.Endpoint.Port
          PG_DB: people_counter
          PG_USER: lambda_pos_writer
          PG_REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          # Placeholder — el codigo real esta en src/cloud/ingest_pos_transaction.py
          # y se sube con scripts/deploy_lambda.sh
          def handler(event, context):
              import json
              print(json.dumps({"received": event}))
              return {"statusCode": 501, "body": "Deploy real ingest_pos_transaction.py + psycopg layer"}
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  IngestPosLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/people-counter-ingest-pos-${Environment}"
      RetentionInDays: 14

  IngestPosApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "people-counter-pos-${Environment}"
      Description: API REST para ingesta de transacciones POS (US-06)
      ProtocolType: HTTP
      Tags: {Project: people-counter, Environment: !Ref Environment}

  IngestPosIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IngestPosApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt IngestPosLambda.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  IngestPosRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IngestPosApi
      RouteKey: "POST /pos/transactions"
      # IAM auth: el POS firma con SigV4 contra un IAM user/role con
      # execute-api:Invoke. Sin firma valida -> 403 antes de invocar la Lambda.
      AuthorizationType: AWS_IAM
      Target: !Sub "integrations/${IngestPosIntegration}"

  IngestPosStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref IngestPosApi
      StageName: "$default"
      AutoDeploy: true
      # Throttle por route — HTTP API v2 no soporta UsagePlans, pero RouteSettings
      # con ThrottlingRateLimit/Burst sí. Cap del stage protege ambos endpoints
      # (POS ingest + Query API) contra abuse / pool exhaustion en RDS t4g.micro.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10    # req/s steady
        ThrottlingBurstLimit: 20   # burst concurrente
      Tags: {Project: people-counter, Environment: !Ref Environment}

  # Custom domain api.<DomainName> para la POS API. Solo se crea cuando se
  # pasa ApiCertArn (cert ACM regional ya validado, fuera de CFN como el de
  # Grafana). El ApiMapping con key vacia rutea el root del dominio al stage
  # $default, asi api.<DomainName>/pos/transactions == la URL execute-api.
  IngestPosDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiCustomDomain
    Properties:
      DomainName: !Sub "api.${DomainName}"
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags: {Project: people-counter, Environment: !Ref Environment}

  IngestPosApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiCustomDomain
    Properties:
      ApiId: !Ref IngestPosApi
      DomainName: !Ref IngestPosDomainName
      Stage: !Ref IngestPosStage

  IngestPosLambdaPermissionApiGw:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestPosLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IngestPosApi}/*/*/pos/transactions"

  IngestPosLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-ingest-pos-errors-${Environment}"
      AlarmDescription: Lambda ingest_pos con errores (auth IAM falla / DB unreachable / validaciones rotas)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref IngestPosLambda}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # =========================================================================
  # Query Aggregates API — Lambda + 2 routes en el MISMO IngestPosApi
  # =========================================================================
  # Endpoint REST de consulta de agregados (T9.12, US-09, RF-13). Conviven con
  # /pos/transactions en la misma API Gateway HTTP API por dos razones:
  # (1) compartir custom domain api.<DomainName> sin pagar API GW extra; (2)
  # configurar throttling una sola vez vía RouteSettings.
  #
  # Cap de throttle a nivel route (RouteSettings) — 10 req/s steady + burst 20.
  # API Gateway HTTP API NO soporta UsagePlans (eso es REST API v1); con stage
  # throttle alcanza para evitar que un cliente malicioso tire la Lambda.

  QueryAggregatesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "people-counter-query-aggregates-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rds-iam-auth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SELECT-only sobre las tablas raw (least privilege). Creado por
              # el bloque correspondiente en infra/sql/bootstrap.sql.
              - Effect: Allow
                Action: [rds-db:connect]
                Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RdsInstance.DbiResourceId}/lambda_query_reader"

  QueryAggregatesLambda:
    Type: AWS::Lambda::Function
    DependsOn: QueryAggregatesLambdaLogGroup
    Properties:
      FunctionName: !Sub "people-counter-query-aggregates-${Environment}"
      Runtime: python3.13
      Handler: query_aggregates.handler
      Role: !GetAtt QueryAggregatesLambdaRole.Arn
      # Timeout 29s = max del API GW HTTP API integration. SQL pesado (90d × 1h)
      # mide ~3-5s en t4g.micro; queda margen para timeouts transitorios.
      Timeout: 29
      MemorySize: 512
      Environment:
        Variables:
          PG_HOST: !GetAtt RdsInstance.Endpoint.Address
          PG_PORT: !GetAtt RdsInstance.Endpoint.Port
          PG_DB: people_counter
          PG_USER: lambda_query_reader
          PG_REGION: !Ref AWS::Region
          API_BASE_URL: !If
            - HasApiCustomDomain
            - !Sub "https://api.${DomainName}"
            - !Sub "https://${IngestPosApi}.execute-api.${AWS::Region}.amazonaws.com"
      Code:
        ZipFile: |
          # Placeholder — el codigo real esta en src/cloud/query_aggregates.py
          # y se sube via Deploy-LambdaCode en deploy.ps1 (Phase 4).
          def handler(event, context):
              import json
              print(json.dumps({"received": event}))
              return {"statusCode": 501, "body": "Deploy real query_aggregates.py + psycopg layer"}
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  QueryAggregatesLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/people-counter-query-aggregates-${Environment}"
      RetentionInDays: 14

  QueryAggregatesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IngestPosApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt QueryAggregatesLambda.Arn
      IntegrationMethod: POST  # API GW invoca la Lambda con POST aunque la route sea GET.
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  QueryAggregatesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IngestPosApi
      RouteKey: "GET /v1/aggregates"
      AuthorizationType: AWS_IAM
      Target: !Sub "integrations/${QueryAggregatesIntegration}"

  # OpenAPI spec endpoint — sin auth (los clientes B2B la consumen para generar
  # su SDK ANTES de tener credenciales SigV4). El throttle del stage la cubre
  # contra abuse.
  QueryOpenapiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IngestPosApi
      RouteKey: "GET /v1/openapi.json"
      AuthorizationType: NONE
      Target: !Sub "integrations/${QueryAggregatesIntegration}"

  QueryAggregatesLambdaPermissionApiGw:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QueryAggregatesLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      # Wildcard para cubrir las 2 routes (/v1/aggregates y /v1/openapi.json).
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IngestPosApi}/*/*/v1/*"

  QueryAggregatesLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-query-aggregates-errors-${Environment}"
      AlarmDescription: Lambda query_aggregates con errores (auth IAM falla / DB unreachable / SQL roto)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref QueryAggregatesLambda}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  QueryAggregatesLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-query-aggregates-latency-${Environment}"
      AlarmDescription: Query API latency p99 alta (cliente percibe API lenta — investigar query plan / RDS)
      Namespace: PeopleCounter/QueryAPI
      MetricName: LatencyMs
      Dimensions:
        - {Name: Endpoint, Value: aggregates}
        - {Name: Bucket,   Value: 15min}
      Statistic: Maximum  # proxy de p99 con baja frecuencia de invocacion
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000  # 5s sustained
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # =========================================================================
  # SES — email delivery para alerting de Grafana (S10)
  # =========================================================================
  # Grafana alerting necesita un canal de delivery. Reutilizamos SES porque ya
  # tenemos el dominio (mismo que Grafana/API custom domain). DKIM auto via
  # SES — emite 3 CNAMEs que entran al DNS externo (mismo pattern que ACM).
  # Sandbox: max 200 emails/dia + destinatario debe estar verificado. Para 1
  # operador alcanza; salir del sandbox via support request si la flota crece.

  SesDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT

  # Identity adicional para el AlertEmail (sandbox requirement). Al crearla,
  # AWS manda un mail de verificacion con un link — el operador debe clickear
  # antes de que Grafana pueda mandarle alertas. Sin esto el SES rechaza el
  # send con "Email address is not verified".
  SesAlertEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref AlertEmail

  # IAM user dedicado para SMTP. Action restringida a SendRawEmail/SendEmail,
  # pero Resource=* porque SES sandbox chequea autorización sobre AMBAS
  # identities (FROM y TO) y restringir a la del dominio causa
  # "AccessDenied on identity/<recipient-email>" al enviar a destinatarios
  # verificados. El principal sigue siendo least-privilege real: este IAM
  # user no tiene ningún otro permiso ni se reusa para otra cosa.
  SesSmtpUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "people-counter-ses-smtp-${Environment}"
      Policies:
        - PolicyName: ses-send-raw
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ses:SendRawEmail, ses:SendEmail]
                Resource: "*"

  SesSmtpAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref SesSmtpUser

  # Secret que Grafana consume via ECS Secrets injection. Pre-popular con
  # smtpUser (IAM access key ID) + rawSecretKey (para derivar el password
  # offline) + smtpPassword=PLACEHOLDER (lo settea deploy.ps1 con el HMAC
  # derivado del rawSecretKey).
  #
  # Por qué no derivar el smtpPassword aca: CFN no tiene intrinsic functions
  # para HMAC-SHA256. Alternativas: (a) Custom Resource Lambda — overkill
  # para una operacion one-shot al setup; (b) post-CFN script — simple,
  # transparente, y reusa el flow ya existente de pause-for-DNS.
  SesSmtpSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "people-counter-ses-smtp-${Environment}"
      Description: SES SMTP creds para Grafana alerting. smtpPassword se setea post-CFN via deploy.ps1.
      SecretString: !Sub |
        {
          "smtpUser": "${SesSmtpAccessKey}",
          "rawSecretKey": "${SesSmtpAccessKey.SecretAccessKey}",
          "smtpPassword": "PLACEHOLDER_SET_BY_DEPLOY_PS1"
        }
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  GrafanaEcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: !Sub "people-counter/grafana-${Environment}"
      EmptyOnDelete: true   # permite delete del repo aunque tenga imagenes
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Mantener solo las ultimas 5 imagenes",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  # NOTA: el cert ACM para Grafana se crea fuera de CFN (deploy.ps1 corre
  # `aws acm request-certificate` + espera a que validate por DNS). El ARN
  # entra al stack via parametro GrafanaCertArn. Razon: si el cert esta
  # dentro del stack con DnsValidation, `cloudformation deploy` bloquea
  # esperando que el operador agregue los CNAMEs de validacion en el DNS
  # externo — peor UX que pausar el script con un Read-Host claro.

  # =========================================================================
  # ECS Fargate + ALB — Grafana OSS (solo se crea cuando DeployGrafana=true)
  # =========================================================================

  # Sin VPC Connector — los tasks corren en public subnets con
  # AssignPublicIp=ENABLED, conectan a RDS por endpoint publico (mismo
  # modelo que Lambda persist_event). Evita NAT/VPC endpoints.

  GrafanaCluster:
    Type: AWS::ECS::Cluster
    Condition: DeployGrafanaCondition
    Properties:
      ClusterName: !Sub "people-counter-grafana-${Environment}"
      CapacityProviders: [FARGATE]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  GrafanaLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployGrafanaCondition
    Properties:
      LogGroupName: !Sub "/ecs/people-counter-grafana-${Environment}"
      RetentionInDays: 14

  # Execution role: lo usa el agente de Fargate para pull de la imagen ECR +
  # escribir CloudWatch Logs + inyectar secrets desde Secrets Manager al
  # container al startup (NO lo ve el codigo de Grafana — Grafana solo ve
  # la env var resuelta).
  # Token compartido Grafana <-> image-renderer. El endpoint /render es
  # interno (localhost:8081 dentro del task, sin PortMapping al ALB), pero el
  # renderer exige token != '-' (CVE-2022-31176). Autogenerado → no hay secreto
  # literal en el template. NOTA: el task-def vivo se actualizó a mano (2026-06)
  # con un token plano por env; al próximo deploy de CFN pasa a este secret.
  RendererTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: DeployGrafanaCondition
    Properties:
      Name: !Sub "people-counter-renderer-token-${Environment}"
      Description: Token compartido Grafana <-> grafana-image-renderer (sidecar interno)
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: token
        ExcludePunctuation: true
        PasswordLength: 48

  GrafanaTaskExecutionRole:
    Type: AWS::IAM::Role
    Condition: DeployGrafanaCondition
    Properties:
      RoleName: !Sub "people-counter-grafana-exec-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secrets-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !Ref RdsMasterSecret
                  - !Ref SesSmtpSecret
                  - !Ref RendererTokenSecret

  # Task role: para llamadas AWS API en runtime desde Grafana. Vacio por
  # ahora — Grafana OSS no llama AWS APIs. Placeholder para datasources
  # tipo CloudWatch/Athena en el futuro.
  GrafanaTaskRole:
    Type: AWS::IAM::Role
    Condition: DeployGrafanaCondition
    Properties:
      RoleName: !Sub "people-counter-grafana-task-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole

  GrafanaTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: DeployGrafanaCondition
    Properties:
      Family: !Sub "people-counter-grafana-${Environment}"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref GrafanaCpu
      Memory: !Ref GrafanaMemory
      ExecutionRoleArn: !GetAtt GrafanaTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt GrafanaTaskRole.Arn
      ContainerDefinitions:
        - Name: grafana
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${GrafanaEcrRepo}:${GrafanaImageTag}"
          Essential: true
          PortMappings:
            - {ContainerPort: 3000, Protocol: tcp}
          Environment:
            - {Name: GF_DATABASE_TYPE,                Value: postgres}
            - {Name: GF_DATABASE_HOST,                Value: !Sub "${RdsInstance.Endpoint.Address}:${RdsInstance.Endpoint.Port}"}
            - {Name: GF_DATABASE_NAME,                Value: grafana}
            - {Name: GF_DATABASE_USER,                Value: people_counter}
            - {Name: GF_DATABASE_SSL_MODE,            Value: require}
            - {Name: GF_SERVER_ROOT_URL,              Value: !Sub "https://${GrafanaSubdomain}.${DomainName}"}
            - {Name: GF_SERVER_DOMAIN,                Value: !Sub "${GrafanaSubdomain}.${DomainName}"}
            - {Name: GF_ANALYTICS_REPORTING_ENABLED,  Value: "false"}
            - {Name: GF_ANALYTICS_CHECK_FOR_UPDATES,  Value: "false"}
            - {Name: GF_AUTH_ANONYMOUS_ENABLED,       Value: "false"}
            - {Name: GF_USERS_ALLOW_SIGN_UP,          Value: "false"}
            # Formato de fecha/hora uniforme en todos los tableros (es-AR):
            # fechas dd/mm, horas hh:mm. Es config de sistema (no por dashboard).
            - {Name: GF_DATE_FORMATS_FULL_DATE,       Value: "DD/MM/YYYY HH:mm:ss"}
            - {Name: GF_DATE_FORMATS_INTERVAL_SECOND, Value: "HH:mm:ss"}
            - {Name: GF_DATE_FORMATS_INTERVAL_MINUTE, Value: "HH:mm"}
            - {Name: GF_DATE_FORMATS_INTERVAL_HOUR,   Value: "DD/MM HH:mm"}
            - {Name: GF_DATE_FORMATS_INTERVAL_DAY,    Value: "DD/MM"}
            - {Name: GF_DATE_FORMATS_INTERVAL_MONTH,  Value: "MM/YYYY"}
            - {Name: GF_DATE_FORMATS_INTERVAL_YEAR,   Value: "YYYY"}
            # Cap del pool de conexiones a RDS — sin esto Grafana abre 1 conn
            # por request y un burst (ej. scanner pegando /login concurrente)
            # agota los slots de la t4g.micro (~85 conn, con reserva
            # rds_reserved). max_open=10 deja techo holgado a single-task y
            # mata el modo de falla observado el 2026-05-25.
            - {Name: GF_DATABASE_MAX_OPEN_CONN,       Value: "10"}
            - {Name: GF_DATABASE_MAX_IDLE_CONN,       Value: "5"}
            # SMTP via AWS SES — alerting de Grafana al operador. Sandbox SES:
            # destinatario debe estar verificado (SesAlertEmailIdentity en este
            # template). FROM usa el subdominio alerts@ del DomainName, cubierto
            # por la DKIM del SesDomainIdentity. STARTTLS mandatory: SES rechaza
            # plain SMTP en el puerto 587 (submission).
            - {Name: GF_SMTP_ENABLED,         Value: "true"}
            - {Name: GF_SMTP_HOST,            Value: !Sub "email-smtp.${AWS::Region}.amazonaws.com:587"}
            - {Name: GF_SMTP_STARTTLS_POLICY, Value: "MandatoryStartTLS"}
            - {Name: GF_SMTP_FROM_ADDRESS,    Value: !Sub "alerts@${DomainName}"}
            - {Name: GF_SMTP_FROM_NAME,       Value: "People Counter Alerts"}
            - {Name: GF_SMTP_SKIP_VERIFY,     Value: "false"}
            # Image renderer (sidecar). Grafana lo invoca en localhost:8081 y el
            # renderer vuelve a Grafana por el callback (localhost:3000, mismo
            # task → awsvpc comparte la ENI). Habilita "Share -> Export image"
            # (PNG del tablero/panel) e imágenes en notificaciones de alertas.
            - {Name: GF_RENDERING_SERVER_URL,   Value: "http://localhost:8081/render"}
            - {Name: GF_RENDERING_CALLBACK_URL, Value: "http://localhost:3000/"}
          Secrets:
            # Fargate inyecta el password del JSON del secret como env var
            # GF_DATABASE_PASSWORD. La sintaxis ${ARN}:password:: extrae la
            # key "password" del JSON; los `::` finales son version-stage
            # / version-id vacios.
            - Name: GF_DATABASE_PASSWORD
              ValueFrom: !Sub "${RdsMasterSecret}:password::"
            # SES SMTP creds desde el SesSmtpSecret. smtpUser = IAM access key
            # ID (Grafana lo usa como usuario SMTP); smtpPassword = derivado
            # del rawSecretKey vía HMAC-SHA256, lo settea deploy.ps1 post-CFN.
            - Name: GF_SMTP_USER
              ValueFrom: !Sub "${SesSmtpSecret}:smtpUser::"
            - Name: GF_SMTP_PASSWORD
              ValueFrom: !Sub "${SesSmtpSecret}:smtpPassword::"
            # Mismo token que el renderer (abajo) — debe matchear.
            - Name: GF_RENDERING_RENDERER_TOKEN
              ValueFrom: !Sub "${RendererTokenSecret}:token::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GrafanaLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: grafana
        # Sidecar de rendering (Chromium headless). No esencial: si revienta, el
        # task sigue vivo y solo se cae la función de export, no Grafana. Límite
        # de memoria propio (1 GiB) para que un pico de Chromium no OOMee el task.
        - Name: renderer
          Image: grafana/grafana-image-renderer:latest
          Essential: false
          Memory: 1024
          PortMappings:
            - {ContainerPort: 8081, Protocol: tcp}
          Environment:
            - {Name: GOMEMLIMIT,     Value: "900MiB"}
            - {Name: RENDERING_MODE, Value: "default"}
          Secrets:
            - Name: AUTH_TOKEN
              ValueFrom: !Sub "${RendererTokenSecret}:token::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GrafanaLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: renderer
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  # SG del ALB: HTTPS 443 desde Internet + HTTP 80 (para redirect a HTTPS).
  GrafanaAlbSg:
    Type: AWS::EC2::SecurityGroup
    Condition: DeployGrafanaCondition
    Properties:
      GroupDescription: ALB de Grafana - HTTPS desde Internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS desde Internet"}
        - {IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0, Description: "HTTP - redirect a HTTPS"}
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  # SG del task ECS: solo acepta trafico desde el SG del ALB en port 3000.
  GrafanaTaskSg:
    Type: AWS::EC2::SecurityGroup
    Condition: DeployGrafanaCondition
    Properties:
      GroupDescription: Tasks ECS de Grafana - solo desde ALB SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !GetAtt GrafanaAlbSg.GroupId
          Description: "Grafana port - desde ALB SG"
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  GrafanaAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: DeployGrafanaCondition
    Properties:
      Name: !Sub "pc-grafana-${Environment}"
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!GetAtt GrafanaAlbSg.GroupId]
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  GrafanaTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: DeployGrafanaCondition
    Properties:
      Name: !Sub "pc-grafana-tg-${Environment}"
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}

  # Listener HTTPS:443 con cert ACM. El cert lo crea deploy.ps1 fuera de CFN
  # y se pasa por parametro GrafanaCertArn.
  GrafanaListenerHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: DeployGrafanaCondition
    Properties:
      LoadBalancerArn: !Ref GrafanaAlb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref GrafanaCertArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GrafanaTargetGroup

  # Listener rules de bloqueo (403 fixed-response) para paths tipicos de
  # scanners/bots. Decision en el ALB, no pega en el backend Grafana — baja
  # carga + ruido en logs. Limite del ALB: max 5 path-patterns por rule,
  # por eso se dividen en dos. Patrones del incidente 2026-05-25:
  # /wp-config.php, /.aws/credentials, /.git/config, /config.json,
  # /google-services.json (todos cubiertos por los wildcards de abajo).
  GrafanaListenerRuleBlockScanners1:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: DeployGrafanaCondition
    Properties:
      ListenerArn: !Ref GrafanaListenerHttps
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/wp-*"      # wordpress (config.php, admin, login, content)
              - "/.git/*"    # repos expuestos (.git/config, HEAD, etc)
              - "/.env*"     # secrets en archivos .env / .env.local
              - "/.aws/*"    # credentials, config
              - "/.ssh/*"    # private keys
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: "text/plain"
            MessageBody: "Forbidden"

  GrafanaListenerRuleBlockScanners2:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: DeployGrafanaCondition
    Properties:
      ListenerArn: !Ref GrafanaListenerHttps
      Priority: 11
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/phpmyadmin/*"
              - "/phpinfo*"
              - "/actuator/*"          # spring boot endpoints
              - "/google-services.json"
              - "/config.json"
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: "text/plain"
            MessageBody: "Forbidden"

  # Listener HTTP:80 - redirect 301 a HTTPS para que Grafana nunca acepte
  # plain HTTP (defense in depth, aparte de force_ssl en Grafana mismo).
  GrafanaListenerHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: DeployGrafanaCondition
    Properties:
      LoadBalancerArn: !Ref GrafanaAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  GrafanaService:
    Type: AWS::ECS::Service
    Condition: DeployGrafanaCondition
    DependsOn: [GrafanaListenerHttps, GrafanaListenerHttp]
    Properties:
      ServiceName: !Sub "people-counter-grafana-${Environment}"
      Cluster: !Ref GrafanaCluster
      TaskDefinition: !Ref GrafanaTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: 200
        # 0% para PoC single-instance: durante el rolling deploy se permite
        # downtime corto (~30s) en vez de duplicar la capacidad. Para prod
        # subir a 100% + DesiredCount >=2 (high availability).
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!GetAtt GrafanaTaskSg.GroupId]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: grafana
          ContainerPort: 3000
          TargetGroupArn: !Ref GrafanaTargetGroup
      HealthCheckGracePeriodSeconds: 90
      PropagateTags: SERVICE
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  # NOTA: el CNAME final `${GrafanaSubdomain}.${DomainName}` -> `${GrafanaAlb.DNSName}`
  # se agrega manualmente al DNS provider externo del PoC. `deploy.ps1` printea
  # el ALB DNS Name + cert validation records y pausa con Read-Host hasta
  # confirmacion del operador.

  # =========================================================================
  # SNS + CloudWatch alarms
  # =========================================================================

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "people-counter-alerts-${Environment}"
      DisplayName: People Counter alerts
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertTopic

  PersistEventLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-persist-event-errors-${Environment}"
      AlarmDescription: Lambda persist_event tirando errores
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref PersistEventLambda}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-rds-cpu-${Environment}"
      AlarmDescription: RDS CPU sustained alto
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref RdsInstance}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 75
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  RdsStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-rds-storage-${Environment}"
      AlarmDescription: RDS free storage por debajo de 2 GB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref RdsInstance}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000000000  # 2 GB en bytes
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  RdsConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-rds-connections-${Environment}"
      AlarmDescription: RDS connections cerca del max (max conn ~85 en t4g.micro)
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref RdsInstance}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 60
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  IoTRuleErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-iot-errors-${Environment}"
      AlarmDescription: IoT Rules tirando errores (ver IoTRuleErrorLogGroup)
      Namespace: AWS/IoT
      MetricName: RuleMessageThrottled
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GrafanaAlb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployGrafanaCondition
    Properties:
      AlarmName: !Sub "people-counter-grafana-5xx-${Environment}"
      AlarmDescription: ALB Grafana - 5xx responses del target sostenidos
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        # LoadBalancerFullName tiene el shape app/<name>/<id> que pide CloudWatch.
        - {Name: LoadBalancer, Value: !GetAtt GrafanaAlb.LoadBalancerFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GrafanaServiceTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployGrafanaCondition
    Properties:
      AlarmName: !Sub "people-counter-grafana-tasks-${Environment}"
      AlarmDescription: Grafana sin hosts sanos detras del ALB (task caido / health check falla / crash loop)
      # HealthyHostCount del target group: es la senal correcta de "Grafana
      # esta sirviendo". RunningTaskCount NO existe en AWS/ECS (solo en
      # ECS/ContainerInsights, que esta disabled) -> antes la alarma no recibia
      # datos y con TreatMissingData=breaching quedaba en ALARM permanente.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: TargetGroup, Value: !GetAtt GrafanaTargetGroup.TargetGroupFullName}
        - {Name: LoadBalancer, Value: !GetAtt GrafanaAlb.LoadBalancerFullName}
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

Outputs:

  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export: {Name: !Sub "people-counter-${Environment}-VpcId"}

  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export: {Name: !Sub "people-counter-${Environment}-PublicSubnet1Id"}

  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export: {Name: !Sub "people-counter-${Environment}-PublicSubnet2Id"}

  RdsEndpoint:
    Description: Endpoint Postgres (host) - usar en DBeaver, Lambdas, Grafana
    Value: !GetAtt RdsInstance.Endpoint.Address
    Export: {Name: !Sub "people-counter-${Environment}-RdsEndpoint"}

  RdsPort:
    Value: !GetAtt RdsInstance.Endpoint.Port
    Export: {Name: !Sub "people-counter-${Environment}-RdsPort"}

  RdsDbName:
    Value: people_counter
    Export: {Name: !Sub "people-counter-${Environment}-RdsDbName"}

  RdsMasterSecretArn:
    Description: ARN del secret con master credentials. DBeaver/scripts leen aca.
    Value: !Ref RdsMasterSecret
    Export: {Name: !Sub "people-counter-${Environment}-RdsMasterSecretArn"}

  RdsSecurityGroupId:
    Description: SG del RDS - el API stack futuro le agrega ingress desde Lambdas
    Value: !GetAtt RdsSecurityGroup.GroupId
    Export: {Name: !Sub "people-counter-${Environment}-RdsSecurityGroupId"}

  RdsResourceId:
    Description: DbiResourceId para construir ARNs de IAM auth (nuevos roles)
    Value: !GetAtt RdsInstance.DbiResourceId
    Export: {Name: !Sub "people-counter-${Environment}-RdsResourceId"}

  GrafanaEcrRepoUri:
    Description: URI del ECR para pushear la imagen Grafana
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${GrafanaEcrRepo}"
    Export: {Name: !Sub "people-counter-${Environment}-GrafanaEcrRepoUri"}

  GrafanaServiceArn:
    Condition: DeployGrafanaCondition
    Description: ARN del ECS service de Grafana (debug/cli)
    Value: !Ref GrafanaService

  GrafanaAlbDnsName:
    Condition: DeployGrafanaCondition
    Description: >
      DNS name del ALB. Target del CNAME que el operador agrega al DNS provider
      para que `${GrafanaSubdomain}.${DomainName}` resuelva al ALB. ACM cert
      ya valido el subdominio en una fase previa del deploy.
    Value: !GetAtt GrafanaAlb.DNSName

  GrafanaAlbHostedZoneId:
    Condition: DeployGrafanaCondition
    Description: Hosted zone ID del ALB - util para crear un ALIAS record al ALB (en vez de CNAME) si el DNS lo soporta
    Value: !GetAtt GrafanaAlb.CanonicalHostedZoneID

  GrafanaUrl:
    Condition: DeployGrafanaCondition
    Description: URL final HTTPS una vez agregado el CNAME al DNS provider
    Value: !Sub "https://${GrafanaSubdomain}.${DomainName}"

  IngestPosApiUrl:
    Description: >
      Endpoint para ingesta POS. El cliente firma con SigV4 (IAM) contra un
      role que tenga execute-api:Invoke. POST {url}/pos/transactions con body
      single {tx} o array [{tx1}, ...].
    Value: !Sub "https://${IngestPosApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export: {Name: !Sub "people-counter-${Environment}-IngestPosApiUrl"}

  IngestPosApiId:
    Value: !Ref IngestPosApi
    Export: {Name: !Sub "people-counter-${Environment}-IngestPosApiId"}

  IngestPosCustomUrl:
    Condition: HasApiCustomDomain
    Description: URL del custom domain de la POS API (una vez agregado el CNAME)
    Value: !Sub "https://api.${DomainName}/pos/transactions"

  IngestPosDomainTarget:
    Condition: HasApiCustomDomain
    Description: Target del CNAME para api.<DomainName> (RegionalDomainName del API GW)
    Value: !GetAtt IngestPosDomainName.RegionalDomainName

  AlertTopicArn:
    Value: !Ref AlertTopic
    Export: {Name: !Sub "people-counter-${Environment}-AlertTopicArn"}

  # SES outputs — deploy.ps1 los lee para mostrar al operador qué CNAMEs
  # agregar al DNS y esperar VerificationStatus=SUCCESS.
  SesDkimToken1Name:
    Description: DKIM CNAME #1 — agregar al DNS del dominio
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenName1
  SesDkimToken1Value:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenValue1
  SesDkimToken2Name:
    Description: DKIM CNAME #2
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenName2
  SesDkimToken2Value:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenValue2
  SesDkimToken3Name:
    Description: DKIM CNAME #3
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenName3
  SesDkimToken3Value:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenValue3
  SesSmtpSecretArn:
    Description: ARN del Secrets Manager con creds SMTP de SES (smtpUser + smtpPassword)
    Value: !Ref SesSmtpSecret
  SesAlertEmail:
    Description: Email del operador que necesita verificacion manual (link en su inbox)
    Value: !Ref AlertEmail

  IoTPolicyName:
    Value: !Ref IoTDevicePolicy
    Export: {Name: !Sub "people-counter-${Environment}-IoTPolicyName"}

  IoTThingTypeName:
    Value: !Ref IoTThingType
    Export: {Name: !Sub "people-counter-${Environment}-IoTThingTypeName"}

  IoTEndpointCommand:
    Description: Obtener endpoint MQTT (no es output del stack - lo expone AWS)
    Value: "aws iot describe-endpoint --endpoint-type iot:Data-ATS --query endpointAddress --output text"
