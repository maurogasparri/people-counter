AWSTemplateFormatVersion: "2010-09-09"
Description: >
  People Counter — Cloud infrastructure.
  IoT Core, Timestream, DynamoDB, Lambda dedup L3, IAM roles.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  TimestreamRetentionHoursMemory:
    Type: Number
    Default: 168  # 7 days
    Description: Hours to keep data in memory store
  TimestreamRetentionDaysMagnetic:
    Type: Number
    Default: 365
    Description: Days to keep data in magnetic store
  DedupTTLDays:
    Type: Number
    Default: 7
    Description: Days to keep dedup hashes in DynamoDB
  AlarmNotificationTopicArn:
    Type: String
    Default: ""
    Description: >
      Optional SNS topic ARN used as AlarmActions for all CloudWatch alarms.
      Leave empty to create alarms that fire silently (visible only in the console).
    AllowedPattern: "^$|^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$"

Conditions:
  HasAlarmNotificationTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, ""]]

Resources:

  # =========================================================================
  # IoT Core
  # =========================================================================

  IoTDevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: people-counter-device-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iot:Connect
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}"
          - Effect: Allow
            Action:
              - iot:Publish
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/counting"
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/wifi_ble"
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/telemetry"
          - Effect: Allow
            Action:
              - iot:Subscribe
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/*"
          - Effect: Allow
            Action:
              - iot:Receive
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/*"

  IoTThingType:
    Type: AWS::IoT::ThingType
    Properties:
      ThingTypeName: people-counter
      ThingTypeProperties:
        ThingTypeDescription: People Counter edge device (RPi5 + Hailo-8L)
        SearchableAttributes:
          - store_id
          - firmware_version
      Tags:
        - Key: Project
          Value: people-counter
        - Key: Environment
          Value: !Ref Environment

  # =========================================================================
  # IoT Rules — route MQTT messages to backends
  # =========================================================================

  IoTRuleCounting:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: people_counter_counting
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/counting'"
        Actions:
          - Timestream:
              DatabaseName: !Ref TimestreamDatabase
              TableName: !GetAtt TimestreamCountingTable.Name
              RoleArn: !GetAtt IoTTimestreamRole.Arn
              Dimensions:
                - Name: device_id
                  Value: "${device_id}"
                - Name: store_id
                  Value: "${topic(2)}"
                - Name: direction
                  Value: "${data.direction}"
              Timestamp:
                Value: "${timestamp()}"
                Unit: MILLISECONDS
        RuleDisabled: false

  IoTRuleTelemetry:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: people_counter_telemetry
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/telemetry'"
        Actions:
          - Timestream:
              DatabaseName: !Ref TimestreamDatabase
              TableName: !GetAtt TimestreamTelemetryTable.Name
              RoleArn: !GetAtt IoTTimestreamRole.Arn
              Dimensions:
                - Name: device_id
                  Value: "${device_id}"
                - Name: store_id
                  Value: "${topic(2)}"
              Timestamp:
                Value: "${timestamp()}"
                Unit: MILLISECONDS
        RuleDisabled: false

  IoTRuleWifiBle:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: people_counter_wifi_ble
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/wifi_ble'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt DedupLambda.Arn
        RuleDisabled: false

  # =========================================================================
  # Timestream
  # =========================================================================

  TimestreamDatabase:
    Type: AWS::Timestream::Database
    Properties:
      DatabaseName: !Sub "people-counter-${Environment}"
      Tags:
        - Key: Project
          Value: people-counter
        - Key: Environment
          Value: !Ref Environment

  TimestreamCountingTable:
    Type: AWS::Timestream::Table
    Properties:
      DatabaseName: !Ref TimestreamDatabase
      TableName: counting
      RetentionProperties:
        MemoryStoreRetentionPeriodInHours: !Ref TimestreamRetentionHoursMemory
        MagneticStoreRetentionPeriodInDays: !Ref TimestreamRetentionDaysMagnetic
      Tags:
        - Key: Project
          Value: people-counter
        - Key: Environment
          Value: !Ref Environment

  TimestreamTelemetryTable:
    Type: AWS::Timestream::Table
    Properties:
      DatabaseName: !Ref TimestreamDatabase
      TableName: telemetry
      RetentionProperties:
        MemoryStoreRetentionPeriodInHours: !Ref TimestreamRetentionHoursMemory
        MagneticStoreRetentionPeriodInDays: !Ref TimestreamRetentionDaysMagnetic
      Tags:
        - Key: Project
          Value: people-counter
        - Key: Environment
          Value: !Ref Environment

  # =========================================================================
  # DynamoDB — WiFi/BLE dedup L3 (inter-camera)
  # =========================================================================

  DedupTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "people-counter-dedup-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: store_date
          AttributeType: S
        - AttributeName: hash
          AttributeType: S
      KeySchema:
        - AttributeName: store_date
          KeyType: HASH
        - AttributeName: hash
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: people-counter
        - Key: Environment
          Value: !Ref Environment

  # =========================================================================
  # Lambda — Dedup L3
  # =========================================================================

  DedupLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "people-counter-dedup-lambda-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt DedupTable.Arn

  DedupLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "people-counter-dedup-${Environment}"
      Runtime: python3.13
      Handler: lambda_dedup.handler
      Code:
        ZipFile: |
          # Placeholder — deploy actual code from src/cloud/lambda_dedup.py
          # Use: scripts/deploy_lambda.sh <environment>
          def handler(event, context):
              return {"statusCode": 501, "body": "Deploy lambda_dedup.py"}
      Role: !GetAtt DedupLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DEDUP_TABLE_NAME: !Ref DedupTable
          DEDUP_TTL_DAYS: !Ref DedupTTLDays
      Tags:
        - Key: Project
          Value: people-counter
        - Key: Environment
          Value: !Ref Environment

  DedupLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DedupLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt IoTRuleWifiBle.Arn

  # =========================================================================
  # CloudWatch alarms — minimum signal for production
  # =========================================================================

  DedupLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-dedup-lambda-errors-${Environment}"
      AlarmDescription: Dedup L3 Lambda is erroring — hashes may not be deduplicated
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DedupLambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  DedupLambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-dedup-lambda-throttles-${Environment}"
      AlarmDescription: Dedup L3 Lambda is being throttled — IoT messages may be dropped
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref DedupLambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  # -------------------------------------------------------------------------
  # Additional alarms added for pilot operations
  # -------------------------------------------------------------------------

  IoTCoreDisconnectAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-iot-disconnects-${Environment}"
      AlarmDescription: >
        Fires when the fleet-wide MQTT disconnect rate stays elevated for more
        than 15 minutes. Uses AWS/IoT Disconnect.Success (count of disconnects
        for any reason). This is a fleet-level alarm — per-device alarms need
        a Dimensions entry with ClientId and are therefore created out-of-band
        by provisioning automation, not here.
      Namespace: AWS/IoT
      MetricName: Disconnect.Success
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  TimestreamWriteErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-timestream-write-errors-${Environment}"
      AlarmDescription: >
        Fires when Timestream WriteRecords reports user or system errors —
        IoT rule is dropping counting/telemetry records.
      Metrics:
        - Id: user_errors
          MetricStat:
            Metric:
              Namespace: AWS/Timestream
              MetricName: UserErrors
              Dimensions:
                - Name: DatabaseName
                  Value: !Ref TimestreamDatabase
                - Name: Operation
                  Value: WriteRecords
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: system_errors
          MetricStat:
            Metric:
              Namespace: AWS/Timestream
              MetricName: SystemErrors
              Dimensions:
                - Name: DatabaseName
                  Value: !Ref TimestreamDatabase
                - Name: Operation
                  Value: WriteRecords
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: total_errors
          Expression: "user_errors + system_errors"
          Label: Timestream WriteRecords errors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  DynamoDBDedupThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-dedup-ddb-throttles-${Environment}"
      AlarmDescription: >
        Fires when the DynamoDB dedup table records throttled read or write
        requests — dedup L3 may be skipping records or retrying excessively.
      Metrics:
        - Id: read_throttles
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref DedupTable
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: write_throttles
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref DedupTable
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: total_throttles
          Expression: "read_throttles + write_throttles"
          Label: DynamoDB dedup throttles
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  DedupLambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-dedup-lambda-duration-${Environment}"
      AlarmDescription: >
        Fires if Lambda p95 duration exceeds 20s. Function timeout is 30s —
        p95 above 20s is the warning band before hard timeouts start.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref DedupLambda
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  LowIngestionRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-low-ingestion-${Environment}"
      AlarmDescription: >
        Fires when the Timestream counting table receives fewer than 10
        SuccessfulRequestLatency samples (i.e. successful WriteRecords calls)
        per hour. Assumption: operating hours are 08:00-22:00 UTC; outside
        that window the alarm will fire but should be treated as informational.
        TODO: convert to AWS::CloudWatch::CompositeAlarm gated by a scheduled
        enable/disable once the pilot is stable.
      Namespace: AWS/Timestream
      MetricName: SuccessfulRequestLatency
      Dimensions:
        - Name: DatabaseName
          Value: !Ref TimestreamDatabase
        - Name: TableName
          Value: !GetAtt TimestreamCountingTable.Name
        - Name: Operation
          Value: WriteRecords
      Statistic: SampleCount
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  # =========================================================================
  # CloudWatch Dashboard — operations overview
  # =========================================================================

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "people-counter-${Environment}-overview"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# People Counter — ${Environment}\nFleet operations overview. Device-level health metrics (CPU temp, Hailo temp, disk free, RAM) are stored in **Timestream** (`people-counter-${Environment}.telemetry`) and are not plotted as CloudWatch metrics. See the Timestream console or the **Device health (Timestream)** note below for the queries to run."
              }
            },
            {
              "type": "text",
              "x": 0, "y": 2, "width": 24, "height": 4,
              "properties": {
                "markdown": "## Device health (Timestream)\n\nRun these in the Timestream query editor against database `people-counter-${Environment}`:\n\n- **Connected devices (last 5min):** `SELECT COUNT(DISTINCT device_id) FROM telemetry WHERE time > ago(5m)`\n- **Avg CPU temp:** `SELECT AVG(measure_value::double) FROM telemetry WHERE measure_name = 'cpu_temp_c' AND time > ago(15m)`\n- **Avg Hailo temp:** `SELECT AVG(measure_value::double) FROM telemetry WHERE measure_name = 'hailo_temp_c' AND time > ago(15m)`\n- **Avg disk free (MB):** `SELECT AVG(measure_value::double) FROM telemetry WHERE measure_name = 'disk_free_mb' AND time > ago(15m)`\n- **Avg memory available (MB):** `SELECT AVG(measure_value::double) FROM telemetry WHERE measure_name = 'mem_available_mb' AND time > ago(15m)`\n- **Frame latency p50/p95:** `SELECT APPROX_PERCENTILE(measure_value::double, 0.5), APPROX_PERCENTILE(measure_value::double, 0.95) FROM telemetry WHERE measure_name = 'frame_latency_ms' AND time > ago(15m)`\n- **MQTT disconnects (sum):** `SELECT SUM(measure_value::bigint) FROM telemetry WHERE measure_name = 'mqtt_disconnects' AND time > ago(1h)`"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "IoT Core — connections & messages",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/IoT", "Connect.Success", { "stat": "Sum", "label": "Connect.Success" } ],
                  [ ".", "Disconnect.Success", { "stat": "Sum", "label": "Disconnect.Success" } ],
                  [ ".", "PublishIn.Success", { "stat": "Sum", "label": "PublishIn.Success" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "IoT Rules — counting / telemetry / wifi_ble",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/IoT", "RuleMessageThrottled", "RuleName", "people_counter_counting", { "stat": "Sum" } ],
                  [ "AWS/IoT", "TopicMatch", "RuleName", "people_counter_counting", { "stat": "Sum" } ],
                  [ "AWS/IoT", "TopicMatch", "RuleName", "people_counter_telemetry", { "stat": "Sum" } ],
                  [ "AWS/IoT", "TopicMatch", "RuleName", "people_counter_wifi_ble", { "stat": "Sum" } ],
                  [ "AWS/IoT", "RuleExecutionFailure", "RuleName", "people_counter_counting", { "stat": "Sum" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "text",
              "x": 0, "y": 12, "width": 24, "height": 1,
              "properties": { "markdown": "## Pipeline performance" }
            },
            {
              "type": "metric",
              "x": 0, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Dedup Lambda — invocations / errors / throttles",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${DedupLambda}", { "stat": "Sum" } ],
                  [ ".", "Errors", ".", ".", { "stat": "Sum" } ],
                  [ ".", "Throttles", ".", ".", { "stat": "Sum" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Dedup Lambda — duration (avg / p95 / max)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${DedupLambda}", { "stat": "Average" } ],
                  [ "...", { "stat": "p95" } ],
                  [ "...", { "stat": "Maximum" } ]
                ],
                "period": 300,
                "annotations": {
                  "horizontal": [
                    { "value": 20000, "label": "p95 alarm 20s", "color": "#d13212" },
                    { "value": 30000, "label": "timeout 30s", "color": "#b7472a" }
                  ]
                }
              }
            },
            {
              "type": "text",
              "x": 0, "y": 19, "width": 24, "height": 1,
              "properties": { "markdown": "## Counting activity" }
            },
            {
              "type": "metric",
              "x": 0, "y": 20, "width": 12, "height": 6,
              "properties": {
                "title": "Counting rule — records ingested (Timestream WriteRecords)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/Timestream", "SuccessfulRequestLatency", "DatabaseName", "${TimestreamDatabase}", "TableName", "${TimestreamCountingTable.Name}", "Operation", "WriteRecords", { "stat": "SampleCount", "label": "WriteRecords count" } ]
                ],
                "period": 300,
                "annotations": {
                  "horizontal": [
                    { "value": 10, "label": "LowIngestionRate threshold (per hr)", "color": "#d13212" }
                  ]
                }
              }
            },
            {
              "type": "text",
              "x": 12, "y": 20, "width": 12, "height": 6,
              "properties": {
                "markdown": "### Counts per minute by store\n\nPer-store counts are dimensions in Timestream, not CloudWatch. Pin the following query into Timestream:\n\n```\nSELECT BIN(time, 1m) AS minute, store_id, direction, COUNT(*) AS events\nFROM \"people-counter-${Environment}\".counting\nWHERE time > ago(1h)\nGROUP BY BIN(time, 1m), store_id, direction\nORDER BY minute DESC\n```\n\nUse the ingress/egress dimension to split bars."
              }
            },
            {
              "type": "text",
              "x": 0, "y": 26, "width": 24, "height": 1,
              "properties": { "markdown": "## Infra health" }
            },
            {
              "type": "metric",
              "x": 0, "y": 27, "width": 8, "height": 6,
              "properties": {
                "title": "Timestream — WriteRecords errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/Timestream", "UserErrors", "DatabaseName", "${TimestreamDatabase}", "Operation", "WriteRecords", { "stat": "Sum" } ],
                  [ ".", "SystemErrors", ".", ".", ".", ".", { "stat": "Sum" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 27, "width": 8, "height": 6,
              "properties": {
                "title": "DynamoDB dedup — consumed capacity",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${DedupTable}", { "stat": "Sum" } ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", ".", { "stat": "Sum" } ],
                  [ ".", "ReadThrottleEvents", ".", ".", { "stat": "Sum" } ],
                  [ ".", "WriteThrottleEvents", ".", ".", { "stat": "Sum" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 27, "width": 8, "height": 6,
              "properties": {
                "title": "IoT Core — active connections (proxy)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/IoT", "Connect.Success", { "stat": "Sum", "label": "Connect.Success" } ],
                  [ ".", "Disconnect.Success", { "stat": "Sum", "label": "Disconnect.Success" } ]
                ],
                "period": 300
              }
            }
          ]
        }

  # =========================================================================
  # IAM — IoT Core → Timestream
  # =========================================================================

  IoTTimestreamRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "people-counter-iot-timestream-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TimestreamWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - timestream:WriteRecords
                Resource:
                  - !GetAtt TimestreamCountingTable.Arn
                  - !GetAtt TimestreamTelemetryTable.Arn
              - Effect: Allow
                Action:
                  - timestream:DescribeEndpoints
                Resource: "*"

# =========================================================================
# Outputs
# =========================================================================

Outputs:
  IoTEndpoint:
    Description: IoT Core data endpoint (use with provision.py --endpoint)
    Value: !Sub "${AWS::AccountId}.iot.${AWS::Region}.amazonaws.com"

  TimestreamDatabase:
    Description: Timestream database name
    Value: !Ref TimestreamDatabase

  DedupTableName:
    Description: DynamoDB dedup table name
    Value: !Ref DedupTable

  DedupLambdaArn:
    Description: Dedup Lambda ARN
    Value: !GetAtt DedupLambda.Arn

  OperationsDashboardURL:
    Description: URL for the operations CloudWatch dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=people-counter-${Environment}-overview"
