AWSTemplateFormatVersion: "2010-09-09"
Description: >
  People Counter - Cloud infrastructure.
  IoT Core (3 rules) -> Lambda persist_event -> RDS Postgres.
  Grafana en App Runner (Grafana OSS, imagen desde ECR privado).
  Lambda usa IAM database auth contra RDS (sin password en runtime).
  RDS publicly accessible con SG IP-allowlist para DBeaver desde admin.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Sufijo de naming para todos los resources.

  DomainName:
    Type: String
    Default: tfg.gasparri.com.ar
    Description: Dominio raiz para custom domains (Grafana y futuro API).

  GrafanaSubdomain:
    Type: String
    Default: grafana
    Description: Subdominio para Grafana. URL final = <sub>.<domain>.

  AdminCidr:
    Type: String
    Default: 181.171.27.186/32
    Description: >
      CIDR autorizado a conectar al RDS publico (puerto 5432) para DBeaver/psql.
      Restringir a tu IP - NO usar 0.0.0.0/0.
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"

  AlertEmail:
    Type: String
    Default: mauro@gasparri.com.ar
    Description: Email para suscribir al SNS de alertas (CloudWatch alarms).
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

  RdsInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t4g.large]
    Description: Instance class del RDS. t4g.micro para PoC/Piloto.

  RdsAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: GB iniciales (gp3). Autoscale hasta MaxAllocatedStorage.

  RdsMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 16384
    Description: Tope del autoscale de storage.

  RdsMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Multi-AZ para produccion HA. PoC = false.

  RdsBackupRetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 35
    Description: Dias de retencion de backups. 0=disabled (dev). Free tier max 1.

  GrafanaImageTag:
    Type: String
    Default: latest
    Description: >
      Tag de la imagen Grafana en ECR privado (people-counter/grafana).
      Push manual desde Docker Hub antes del segundo deploy:
        docker pull grafana/grafana:latest
        docker tag  grafana/grafana:latest <ecr-uri>:<tag>
        docker push <ecr-uri>:<tag>

  AppRunnerCpu:
    Type: String
    Default: "0.25 vCPU"
    AllowedValues:
      ["0.25 vCPU", "0.5 vCPU", "1 vCPU", "2 vCPU", "4 vCPU"]

  AppRunnerMemory:
    Type: String
    Default: "0.5 GB"
    AllowedValues:
      ["0.5 GB", "1 GB", "1.5 GB", "2 GB", "3 GB", "4 GB", "6 GB", "8 GB",
       "10 GB", "12 GB"]

  AppRunnerMinSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 25

  AppRunnerMaxSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 25

  DeployAppRunner:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Set a "true" en el segundo deploy, DESPUES de pushear la imagen Grafana
      a ECR y validar el cert ACM. Default "false" permite primer deploy
      sin error de imagen inexistente.

Conditions:

  DeployAppRunnerCondition:
    !Equals [!Ref DeployAppRunner, "true"]

  IsMultiAZ:
    !Equals [!Ref RdsMultiAZ, "true"]

Resources:

  # =========================================================================
  # Networking — VPC + 2 public subnets + IGW.
  # Subnets son "public" en sentido routing (tienen route a IGW), pero los
  # resources que viven adentro (RDS, App Runner VPC Connector ENIs) NO
  # reciben public IP automático. RDS está PubliclyAccessible vía AWS DNS.
  # =========================================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: !Sub "people-counter-vpc-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub "people-counter-igw-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "people-counter-public-1-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "people-counter-public-2-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "people-counter-public-rt-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # =========================================================================
  # IoT Core — policy + thing type + 3 rules (counting / telemetry / wifi_ble)
  # =========================================================================

  IoTDevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub "people-counter-device-policy-${Environment}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [iot:Connect]
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}"
          - Effect: Allow
            Action: [iot:Publish]
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/counting"
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/wifi_ble"
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/store/*/telemetry"
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/*"
          - Effect: Allow
            Action: [iot:Subscribe]
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/*"
          - Effect: Allow
            Action: [iot:Receive]
            Resource:
              - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/*"

  IoTThingType:
    Type: AWS::IoT::ThingType
    Properties:
      ThingTypeName: !Sub "people-counter-${Environment}"
      ThingTypeProperties:
        ThingTypeDescription: People Counter edge device (RPi5 + Hailo-8L)
        SearchableAttributes: [store_id, firmware_version]
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  IoTRuleErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/iot/people-counter-rule-errors-${Environment}"
      RetentionInDays: 14

  IoTRuleErrorLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "people-counter-iot-rule-error-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: iot.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-error-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IoTRuleErrorLogGroup.Arn

  IoTRuleCounting:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "people_counter_counting_${Environment}"
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/counting'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PersistEventLambda.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleErrorLogRole.Arn

  IoTRuleTelemetry:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "people_counter_telemetry_${Environment}"
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/telemetry'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PersistEventLambda.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleErrorLogRole.Arn

  IoTRuleWifiBle:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "people_counter_wifi_ble_${Environment}"
      TopicRulePayload:
        Sql: "SELECT * FROM 'store/+/wifi_ble'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PersistEventLambda.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleErrorLogRole.Arn

  # =========================================================================
  # RDS Postgres — Multi-AZ optional, IAM auth ON, TLS forzado
  # =========================================================================

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Postgres - ingress 5432 desde admin + App Runner + Lambda (via IAM auth)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref AdminCidr
          Description: DBeaver/psql desde admin (IP allowlist)
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: "Lambda out-of-VPC con IAM auth (TLS forzado)"
      Tags:
        - {Key: Name, Value: !Sub "people-counter-rds-sg-${Environment}"}
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "people-counter-rds-subnets-${Environment}"
      DBSubnetGroupDescription: Subnets para RDS Postgres (publicas para PubliclyAccessible)
      SubnetIds: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  RdsParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: "Postgres 16 - TLS forzado + logging para debug"
      Parameters:
        rds.force_ssl: "1"
        log_min_duration_statement: "1000"
        log_connections: "1"
        log_disconnections: "1"
        log_lock_waits: "1"
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  RdsMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "people-counter/${Environment}/rds-master"
      Description: RDS master password (people_counter user). Auto-generado.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"people_counter"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\$''`'
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "people-counter-${Environment}"
      Engine: postgres
      EngineVersion: "16.4"
      DBInstanceClass: !Ref RdsInstanceClass
      AllocatedStorage: !Ref RdsAllocatedStorage
      MaxAllocatedStorage: !Ref RdsMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: people_counter
      MasterUsername: !Sub '{{resolve:secretsmanager:${RdsMasterSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RdsMasterSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups: [!GetAtt RdsSecurityGroup.GroupId]
      DBParameterGroupName: !Ref RdsParameterGroup
      PubliclyAccessible: true
      MultiAZ: !If [IsMultiAZ, true, false]
      BackupRetentionPeriod: !Ref RdsBackupRetentionDays
      PreferredBackupWindow: "03:00-04:00"          # UTC = 00:00-01:00 AR
      PreferredMaintenanceWindow: "sun:04:00-sun:05:00"  # UTC = sun 01:00-02:00 AR
      EnableIAMDatabaseAuthentication: true
      EnablePerformanceInsights: false  # subir a true cuando llegue prod
      DeletionProtection: false  # subir a true cuando llegue prod
      EnableCloudwatchLogsExports: [postgresql]
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  # =========================================================================
  # Lambda persist_event — IoT Rules → RDS Postgres (vía IAM auth)
  # =========================================================================

  PersistEventLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "people-counter-persist-event-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rds-iam-auth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Generar token de auth IAM contra el user "lambda_writer".
              # El user de Postgres se crea en el SQL de bootstrap post-deploy.
              - Effect: Allow
                Action: [rds-db:connect]
                Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RdsInstance.DbiResourceId}/lambda_writer"

  PersistEventLambda:
    Type: AWS::Lambda::Function
    DependsOn: PersistEventLambdaLogGroup
    Properties:
      FunctionName: !Sub "people-counter-persist-event-${Environment}"
      Runtime: python3.13
      Handler: persist_event.handler
      Role: !GetAtt PersistEventLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PG_HOST: !GetAtt RdsInstance.Endpoint.Address
          PG_PORT: !GetAtt RdsInstance.Endpoint.Port
          PG_DB: people_counter
          PG_USER: lambda_writer
          PG_REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          # Placeholder — el código real está en src/cloud/persist_event.py
          # y se sube con scripts/deploy_lambda.sh
          # La Lambda real autentica vía rds.generate-db-auth-token (IAM auth)
          # y conecta con psycopg sobre TLS al RDS.
          def handler(event, context):
              import json
              print(json.dumps({"received": event}))
              return {"statusCode": 501, "body": "Deploy real persist_event.py + psycopg layer"}
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  PersistEventLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/people-counter-persist-event-${Environment}"
      RetentionInDays: 14

  PersistEventLambdaPermissionCounting:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PersistEventLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/people_counter_counting_${Environment}"

  PersistEventLambdaPermissionTelemetry:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PersistEventLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/people_counter_telemetry_${Environment}"

  PersistEventLambdaPermissionWifiBle:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PersistEventLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/people_counter_wifi_ble_${Environment}"

  # =========================================================================
  # ECR — repo privado para imagen Grafana (push manual desde Docker Hub)
  # =========================================================================

  GrafanaEcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: !Sub "people-counter/grafana-${Environment}"
      EmptyOnDelete: true   # permite delete del repo aunque tenga imagenes
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Mantener solo las ultimas 5 imagenes",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  # NOTA: el ACM cert NO se crea acá. App Runner gestiona su propio cert
  # managed para el custom domain (Grafana). El futuro API stack creará su
  # propio cert ACM para api.<DomainName>.

  # =========================================================================
  # App Runner — Grafana OSS (solo se crea cuando DeployAppRunner=true)
  # =========================================================================

  # Sin VPC Connector — App Runner se conecta a RDS por endpoint publico
  # (mismo modelo que Lambda persist_event). Evita NAT/VPC endpoints.

  GrafanaAutoScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Condition: DeployAppRunnerCondition
    Properties:
      AutoScalingConfigurationName: !Sub "pc-grafana-${Environment}"
      MaxConcurrency: 100
      MinSize: !Ref AppRunnerMinSize
      MaxSize: !Ref AppRunnerMaxSize
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  GrafanaInstanceRole:
    Type: AWS::IAM::Role
    Condition: DeployAppRunnerCondition
    Properties:
      RoleName: !Sub "people-counter-grafana-instance-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: tasks.apprunner.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-grafana-config
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Grafana lee config DB (Postgres) — credenciales del secret de RDS
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref RdsMasterSecret

  GrafanaAccessRole:
    Type: AWS::IAM::Role
    Condition: DeployAppRunnerCondition
    Properties:
      RoleName: !Sub "people-counter-grafana-access-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: build.apprunner.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  GrafanaService:
    Type: AWS::AppRunner::Service
    Condition: DeployAppRunnerCondition
    Properties:
      ServiceName: !Sub "people-counter-grafana-${Environment}"
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt GrafanaAccessRole.Arn
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${GrafanaEcrRepo}:${GrafanaImageTag}"
          ImageConfiguration:
            Port: "3000"
            # NOTA: env vars de Grafana se setean post-deploy via
            # aws apprunner update-service (ver deploy.ps1 phase 3b).
            # CFN early validation rechaza alguna combinacion de
            # RuntimeEnvironmentVariables con dynamic references.
      InstanceConfiguration:
        Cpu: !Ref AppRunnerCpu
        Memory: !Ref AppRunnerMemory
        InstanceRoleArn: !GetAtt GrafanaInstanceRole.Arn
      AutoScalingConfigurationArn: !Ref GrafanaAutoScaling
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: DEFAULT
        IngressConfiguration:
          IsPubliclyAccessible: true
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 20
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  # NOTA: AWS::AppRunner::CustomDomainAssociation NO existe como resource CFN
  # nativo. La asociación del custom domain se hace post-deploy con:
  #   aws apprunner associate-custom-domain \
  #     --service-arn <GrafanaServiceArn> \
  #     --domain-name grafana.gasparri.com.ar
  # Después AWS devuelve 2-3 CNAMEs de validación que van al DNS provider.
  # Ver paso "Phase 2.5" en infra/README.md.

  # =========================================================================
  # SNS + CloudWatch alarms
  # =========================================================================

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "people-counter-alerts-${Environment}"
      DisplayName: People Counter alerts
      Tags:
        - {Key: Project, Value: people-counter}
        - {Key: Environment, Value: !Ref Environment}

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertTopic

  PersistEventLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-persist-event-errors-${Environment}"
      AlarmDescription: Lambda persist_event tirando errores
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref PersistEventLambda}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-rds-cpu-${Environment}"
      AlarmDescription: RDS CPU sustained alto
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref RdsInstance}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 75
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  RdsStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-rds-storage-${Environment}"
      AlarmDescription: RDS free storage por debajo de 2 GB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref RdsInstance}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000000000  # 2 GB en bytes
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  RdsConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-rds-connections-${Environment}"
      AlarmDescription: RDS connections cerca del max (max conn ~85 en t4g.micro)
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref RdsInstance}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 60
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  IoTRuleErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "people-counter-iot-errors-${Environment}"
      AlarmDescription: IoT Rules tirando errores (ver IoTRuleErrorLogGroup)
      Namespace: AWS/IoT
      MetricName: RuleMessageThrottled
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GrafanaServiceErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAppRunnerCondition
    Properties:
      AlarmName: !Sub "people-counter-grafana-5xx-${Environment}"
      AlarmDescription: App Runner Grafana 5xx responses sostenidos
      Namespace: AWS/AppRunner
      MetricName: "5xxStatusResponses"
      Dimensions:
        - {Name: ServiceName, Value: !Sub "people-counter-grafana-${Environment}"}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:

  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export: {Name: !Sub "people-counter-${Environment}-VpcId"}

  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export: {Name: !Sub "people-counter-${Environment}-PublicSubnet1Id"}

  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export: {Name: !Sub "people-counter-${Environment}-PublicSubnet2Id"}

  RdsEndpoint:
    Description: Endpoint Postgres (host) - usar en DBeaver, Lambdas, Grafana
    Value: !GetAtt RdsInstance.Endpoint.Address
    Export: {Name: !Sub "people-counter-${Environment}-RdsEndpoint"}

  RdsPort:
    Value: !GetAtt RdsInstance.Endpoint.Port
    Export: {Name: !Sub "people-counter-${Environment}-RdsPort"}

  RdsDbName:
    Value: people_counter
    Export: {Name: !Sub "people-counter-${Environment}-RdsDbName"}

  RdsMasterSecretArn:
    Description: ARN del secret con master credentials. DBeaver/scripts leen aca.
    Value: !Ref RdsMasterSecret
    Export: {Name: !Sub "people-counter-${Environment}-RdsMasterSecretArn"}

  RdsSecurityGroupId:
    Description: SG del RDS - el API stack futuro le agrega ingress desde Lambdas
    Value: !GetAtt RdsSecurityGroup.GroupId
    Export: {Name: !Sub "people-counter-${Environment}-RdsSecurityGroupId"}

  RdsResourceId:
    Description: DbiResourceId para construir ARNs de IAM auth (nuevos roles)
    Value: !GetAtt RdsInstance.DbiResourceId
    Export: {Name: !Sub "people-counter-${Environment}-RdsResourceId"}

  GrafanaEcrRepoUri:
    Description: URI del ECR para pushear la imagen Grafana
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${GrafanaEcrRepo}"
    Export: {Name: !Sub "people-counter-${Environment}-GrafanaEcrRepoUri"}

  GrafanaServiceArn:
    Condition: DeployAppRunnerCondition
    Description: ARN del service - usar en associate-custom-domain post-deploy
    Value: !GetAtt GrafanaService.ServiceArn

  GrafanaServiceUrl:
    Condition: DeployAppRunnerCondition
    Description: URL default de App Runner (antes del custom domain)
    Value: !Sub "https://${GrafanaService.ServiceUrl}"

  GrafanaServiceDnsTarget:
    Condition: DeployAppRunnerCondition
    Description: Target del CNAME para grafana.DomainName (despues de associate-custom-domain)
    Value: !GetAtt GrafanaService.ServiceUrl

  GrafanaUrl:
    Condition: DeployAppRunnerCondition
    Description: URL final una vez asociado el custom domain
    Value: !Sub "https://${GrafanaSubdomain}.${DomainName}"

  AlertTopicArn:
    Value: !Ref AlertTopic
    Export: {Name: !Sub "people-counter-${Environment}-AlertTopicArn"}

  IoTPolicyName:
    Value: !Ref IoTDevicePolicy
    Export: {Name: !Sub "people-counter-${Environment}-IoTPolicyName"}

  IoTThingTypeName:
    Value: !Ref IoTThingType
    Export: {Name: !Sub "people-counter-${Environment}-IoTThingTypeName"}

  IoTEndpointCommand:
    Description: Obtener endpoint MQTT (no es output del stack - lo expone AWS)
    Value: "aws iot describe-endpoint --endpoint-type iot:Data-ATS --query endpointAddress --output text"
