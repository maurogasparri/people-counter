[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "people-counter"
version = "1.0.0"
description = "Low-cost people counting for retail via stereo vision and edge AI"
requires-python = ">=3.11"
dependencies = [
    # Cota superior deliberada: OpenCV 5.0 removio cv2.fisheye.CALIB_RECOMPUTE_EXTRINSIC,
    # que usa el solve de calibracion estereo (src/vision/calibration.py). Sin la
    # cota, una instalacion limpia resuelve a 5.x y la calibracion falla en
    # tiempo de ejecucion. Portar el pipeline a la API de OpenCV 5 es trabajo
    # aparte; este repositorio reproduce los resultados sobre la serie 4.x.
    "opencv-contrib-python>=4.10,<5",
    "numpy>=2.0",
    "scipy>=1.13",
    "paho-mqtt>=2.1",
    "pyyaml>=6.0",
    "scapy>=2.6",
    "bleak>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "black>=24.0", "ruff>=0.5"]
# Tooling de provisioning del workstation: el seed de sites/devices en RDS
# (scripts/provision.py) conecta con psycopg + boto3 — mismo stack que la
# Lambda, SIN docker ni psql instalado (cross-platform vía pip).
provisioning = ["psycopg[binary]>=3.1", "boto3>=1.34"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
