[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "people-counter"
version = "0.1.0"
description = "Low-cost people counting for retail via stereo vision and edge AI"
requires-python = ">=3.11"
dependencies = [
    "opencv-contrib-python>=4.10",
    "numpy>=2.0",
    "scipy>=1.13",
    "paho-mqtt>=2.1",
    "pyyaml>=6.0",
    "scapy>=2.6",
    "bleak>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "black>=24.0", "ruff>=0.5"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
