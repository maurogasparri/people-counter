# =============================================================================
# People Counter — Per-Device Configuration
# =============================================================================
#
# Configuration strategy:
#
# HARDWARE (config/hardware.yaml — committed) — Fleet invariants. Bracket
#   geometry, sensor defaults, runtime resolution + fps, calibration file
#   path, SGBM/detection/tracking tuning, MQTT contract, buffer/log paths.
#   Set once in lab; never touched per-site.
#
# THIS FILE (/etc/people-counter/config.yaml — per-device) — Per-site
#   identity, geometry that changes with the physical layout (mounting
#   height, ROI/lines for the local door, classifier thresholds), MQTT
#   credentials, operational policies. Rarely edited after install except
#   via the cloud shadow.
#
# CLOUD (AWS IoT Device Shadow) — Business-driven values inside the
#   `cloud_defaults` block, pushed remotely without SSH. Whitelisted runtime-
#   safe keys also apply live (see RUNTIME_SAFE_KEYS in src/config/loader.py).
#
# Any key that appears here AND in hardware.yaml: this file wins. The
# fallback to hardware.yaml only kicks in when the key is missing here, so
# keep this file lean — only override fleet defaults when the site truly
# requires it.
# =============================================================================

# --- Device identity (set once during provisioning) ---
device:
  id: "store-001-cam-01"          # Unique device ID (matches IoT Core thing name)
  store_id: "store-001"           # Site/store identifier
  store_name: "Store Name"        # Human-readable (display only)

# --- Per-site geometry ---
# Camera resolution, fps, calibration_file path, SGBM tuning all live in
# hardware.yaml.vision_runtime — those are fleet-wide. The only per-site
# override here is the camera mounting height (varies with the local
# ceiling height).
vision:
  mounting_height_m: 3.0          # Distance from floor to camera mount, in
                                  # metres. Drives auto num_disparities and
                                  # the head-height classifier. Must be
                                  # accurate to ±5cm or depth-derived heights
                                  # drift.

# --- Counter (ROI + N directional lines) — site geometry ---
#
# Lifecycle: a track that enters the ROI, crosses one of the configured
# lines in a labelled direction, and exits the ROI emits an event with that
# label. Crossings in unlabelled directions are silently ignored — that's
# how a one-way gate is modelled (one door is IN-only, the other OUT-only,
# or both ways on the same line).
#
# Examples:
#   * One door, both directions count (typical retail entrance):
#       counter:
#         roi: { x_min: 100, x_max: 540, y_min: 180, y_max: 300 }
#         lines:
#           - from: [100, 240]
#             to:   [540, 240]
#             labels:
#               top_to_bottom: ingress
#               bottom_to_top: egress
#
#   * Two physically separate doors (one IN, one OUT):
#       counter:
#         roi: { x_min: 100, x_max: 540, y_min: 100, y_max: 400 }
#         lines:
#           - from: [120, 250]    # left half — IN gate
#             to:   [320, 250]
#             labels: { top_to_bottom: ingress }
#           - from: [340, 250]    # right half — OUT gate
#             to:   [540, 250]
#             labels: { bottom_to_top: egress }
#
# Lines must be axis-aligned (horizontal: same y, vertical: same x). Valid
# direction keys: horizontal lines use top_to_bottom / bottom_to_top;
# vertical lines use left_to_right / right_to_left.
counter:
  roi:
    x_min: 100
    x_max: 540
    y_min: 180
    y_max: 300
  lines:
    - from: [100, 240]
      to:   [540, 240]
      labels:
        top_to_bottom: ingress
        bottom_to_top: egress
  # Adult/child classifier based on head height above floor (uses stereo
  # depth + mounting_height_m). adult_min_m may need per-site tuning
  # depending on local demographics.
  height_classifier:
    enabled: true
    adult_min_m: 1.55             # Head height (m) ≥ this => adult, else child.
                                  # 1.55m sits near the P25 of adult women in
                                  # Argentina, so few adults misclassify.

# --- WiFi/BLE — site privacy + sensitivity ---
# Protocol constants (interface, intervals, cross-protocol windows) live in
# hardware.yaml.wifi_ble. The toggles + RSSI thresholds stay here because
# privacy/legal toggles and RSSI noise floor are site-dependent.
wifi_ble:
  enabled: true                   # Master switch (overridable from cloud)
  ble_enabled: true               # BLE advertising capture
  rssi_passerby_threshold: -75    # Present in the zone
  rssi_shopper_threshold: -55     # Very close / entered

# --- MQTT — endpoint + per-device certs ---
# Port (8883) and topic templates live in hardware.yaml.mqtt (fleet-wide
# protocol contract). Certs are per-device, set during provisioning.
mqtt:
  endpoint: "xxxxx.iot.us-east-1.amazonaws.com"
  cert_path: "/etc/people-counter/certs/device.pem.crt"
  key_path: "/etc/people-counter/certs/device.pem.key"
  ca_path: "/etc/people-counter/certs/AmazonRootCA1.pem"

# --- Logging level (operator-tunable for debug) ---
# Format/file convention live in hardware.yaml.logging.
logging:
  level: "INFO"

# --- Telemetry interval (cloud-overridable) ---
telemetry:
  interval_seconds: 300

# --- Status LED (per-site aesthetics) ---
status_led:
  enabled: true

# =============================================================================
# CLOUD-PUSHED CONFIG (AWS IoT Device Shadow)
# =============================================================================
# Defaults below are applied at boot if the cloud shadow is unavailable.
# The shadow takes precedence at runtime when it is reachable.
#
# To push a change:
#   aws iot-data update-thing-shadow --thing-name <device_id> \
#     --payload '{"state":{"desired":{"operating_hours":{"monday":"10:00-22:00"}}}}'
# =============================================================================
cloud_defaults:
  operating_hours:
    monday: "10:00-22:00"
    tuesday: "10:00-22:00"
    wednesday: "10:00-22:00"
    thursday: "10:00-22:00"
    friday: "10:00-22:00"
    saturday: "10:00-22:00"
    sunday: "10:00-21:00"

  # fail_open: log WARNING, keep counting (default — no data loss on typo)
  # fail_closed: log CRITICAL, pause counting until valid schedule is pushed
  on_invalid_schedule: "fail_open"

  footfall_scaling_factor: 1.0
  counting_enabled: true
  wifi_ble_enabled: true
  telemetry_interval_seconds: 300
