# =============================================================================
# People Counter — Configuración de Dispositivo
# =============================================================================
#
# Archivo único de configuración per-device. Vive en /etc/people-counter/config.yaml
# en cada dispositivo. Este archivo (config.example.yaml) shippea en el repo como
# TEMPLATE documentado para aprovisionar devices nuevos y auditar qué keys son
# válidas. `load_config()` lee SOLO /etc/people-counter/config.yaml — no hay
# merge runtime contra este template. Cambios fleet-wide se shippean editando
# este archivo + redeployando el config a cada device.
#
# Secciones en orden de relevancia para el operador:
#
#   device           — identidad (seteada durante provisioning)
#   vision           — mounting height + capture/runtime + SGBM + calibración
#   detection        — modelo + thresholds (editar solo con modelo nuevo)
#   counter          — ROI + lines (geometría per-site) + height classifier
#   wifi_ble         — toggles de probing + bandas de RSSI
#   mqtt             — endpoint AWS IoT + certs per-device
#   logging          — nivel (paths fleet-wide)
#   telemetry        — intervalo de reporting
#   status_led       — enable del LED
#   cloud_defaults   — knobs runtime pusheables por shadow de AWS
#
# Avanzado (rara vez tocado — tuning de algoritmo):
#
#   bracket          — baseline físico + asignaciones CSI (LAB)
#   sensor           — invariantes del IMX708 (LAB)
#   lens             — HFOV fisheye (LAB)
#   head_depth       — gate antropométrico de pick de cabeza
#   height           — filtro sanity sobre las alturas reportadas
#   tracking         — tracker Euclidiano + state machine + Kalman
#   buffer           — outbox sqlite local
#   best_frame       — data active-learning con awareness de GDPR (default OFF)
#
# Validación: `src/config/loader.py:load_config()` lee este archivo como defaults,
# mergea el YAML per-device y valida tipos/rangos. Las keys requeridas faltantes
# (device.id, device.store_id, mqtt.endpoint) raisean. Errores de tipo/rango
# raisean con la key ofensora en el mensaje.
# =============================================================================


# =============================================================================
# IDENTIDAD DEL DEVICE (per-device, seteada durante provisioning)
# =============================================================================
device:
  id: "store-001-cam-01"            # Device ID único (matchea con el thing name en IoT Core).
  store_id: "store-001"             # Identificador del local — se usa en topics MQTT.
  store_name: "Store Name"          # Human-readable, solo display.
  firmware_version: "unknown"       # Auto-populado por el deploy; dejar default.


# =============================================================================
# ANALYTICS — unidad mínima de medición operativa
# =============================================================================
# bucket_seconds define cada cuánto se agrega counting + wifi/ble para reportes
# (turn-in rate, conversion rate, hourly aggregates). El device pre-calcula
# event_bucket / period_bucket alineados al epoch (floor(ts / bucket_seconds) *
# bucket_seconds) y los manda en el payload MQTT. Postgres los guarda como
# columnas regulares — no GENERATED — así cambiar el bucket via shadow no
# requiere migration en el schema; los rows viejos preservan su bucket
# original (históricamente correcto).
#
# El publisher wifi/ble usa este mismo valor como ventana de agregación
# (override via wifi_ble.probe_interval_seconds si hace falta).
#
# Defaults razonables: 300 (5min), 900 (15min), 1800 (30min), 3600 (1h).
# 900 es el sweet spot operativo para retail footfall — granularidad útil
# para detectar tendencias intra-hora sin volumen excesivo de filas (~96
# samples/día por device).
analytics:
  bucket_seconds: 900


# =============================================================================
# VISION — captura, rectificación, profundidad
# =============================================================================
vision:
  # --- Geometría per-sitio ---
  mounting_height_m: 3.0            # Distancia del piso al mount de la cámara,
                                    # en metros. Maneja el num_disparities auto
                                    # y el classifier de head-height. Tiene que
                                    # ser preciso a ±5cm o las alturas
                                    # depth-derived driftean. Retail típico:
                                    # 2.5-4.0m.

  # --- Captura runtime ---
  resolution: [1152, 648]           # Resolución runtime. Cuartear de
                                    # 2304×1296 (modo canónico de calibración);
                                    # binned full-FOV. El .npz de calibración
                                    # tiene que ser reescalado para matchear via
                                    # scripts/rescale_calibration.py.
                                    # El sensor raw mode usado por picamera2
                                    # viene de sensor.default_res (sección
                                    # avanzada) — anclar ese override es lo
                                    # que evita que picamera2 elija Mode 0
                                    # cropeado del IMX708 (HFOV efectivo ~80°
                                    # en vez de 120°).
  fps: 30                           # Frame rate de captura a la resolución runtime.
  max_exposure_us: 16000            # Cap de shutter time en microsegundos.
                                    # Limita motion blur para que la distribución
                                    # del runtime quede dentro de la del training.
                                    # 16000us (16ms) reduce blur a ~5cm a 3 m/s
                                    # (caminata viva / trote) — suficiente para
                                    # mantener confidence del detector arriba del
                                    # spawn threshold. AE sigue activo dentro del
                                    # límite, compensa luz baja con AnalogueGain
                                    # (más ruido pero shutter consistente). Setear
                                    # a null para volver al comportamiento default
                                    # (FrameRate=fps, shutter hasta ~1/fps). Side
                                    # effect: la cámara corre internamente a
                                    # 1/max_exposure_us FPS (60 con 16000us); el
                                    # pipeline siempre lee el frame más reciente.
  calibration_file: /etc/people-counter/calibration.npz
                                    # Path al .npz de calibración estéreo.
                                    # Mismo path en cada install; el contenido
                                    # es per-device.

  # --- Semi-Global Block Matching ---
  sgbm:
    num_disparities: auto           # "auto" deriva de mounting_height_m +
                                    # resolución runtime. Int múltiplo de 16
                                    # para override (raro, solo diagnóstico).
    block_size: 9                   # Impar, 5..15.
    downscale: 4                    # 1=full, 2=half, 4=quarter, 8=eighth.
                                    # 4 es el sweet spot calidad/costo para
                                    # head-height a mount 2.0-3.5m: la
                                    # resolución del grid de disparity es
                                    # suficiente para que la mediana de depth
                                    # dentro del bbox de cabeza no se sesgue
                                    # por speckle SGBM, y el costo SGBM
                                    # (~4× el de downscale=8) cabe holgado
                                    # en el budget runtime de la Pi 5.
    # WLS post-filter — defense-in-depth contra holes en bordes de
    # disparity. SGBM mete pixels inválidos cuando left↔right
    # disagree, típicamente en bordes de objetos donde el matching es
    # ambiguo. Sin WLS, un bbox de cabeza que cae sobre una zona con
    # holes hace que el blob_percentile downstream tome una muestra
    # truncada → altura derivada noisy → adult/child classifier
    # inconsistente.
    #
    # ON por default: el costo extra (~2× SGBM compute + filter pass)
    # cabe a downscale=4 en el budget de la Pi 5, y la ganancia en
    # estabilidad de altura justifica el gasto en producción.
    # Apagar (enabled: false) solo si el FPS baja a <10 en el target
    # — en ese caso aumentar downscale a 8 antes que sacar WLS suele
    # ser mejor compromiso.
    wls:
      enabled: true                 # Toggle del post-filter.
      lambda: 4000.0                # Strength del smoothness term.
                                    # Más alto = más smoothing pero menos
                                    # preservación de bordes. 4000 sweet
                                    # spot retail (rellena holes sin lavar
                                    # detalle de cabezas).
      sigma: 1.0                    # Sensibilidad al gradiente del guide.
                                    # 1.0 = smoothing agresivo across
                                    # edges suaves; bajar a 0.5-0.8
                                    # preserva más detalle pero deja
                                    # más holes.

  # --- AE lock timings (compartidos entre runtime + setup tools) ---
  ae_lock:
    initial_settle_seconds: 2.0     # Segundos de settle antes del lock
                                    # provisional cuando se abre la captura.
                                    # En sites con luz fluctuante (vidrieras,
                                    # mixed lighting, HVAC) puede necesitar
                                    # más (3-4s) para que AE converja antes
                                    # de lockear.
    resettle_seconds: 1.5           # Segundos de re-settle entre la
                                    # re-habilitación de AE y el re-lock
                                    # final, cuando el operador apreta
                                    # "Comenzar" con la escena armada
                                    # (focus_assist, calibrate wizard,
                                    # diagnose_bracket).

  # --- ChArUco board + dual-pass detection ---
  charuco:
    board_cols: 9                   # Columnas (cuadrados) del board.
    board_rows: 6                   # Filas (cuadrados) del board.
    square_mm: 45.0                 # Lado del cuadrado, en milímetros.
    marker_mm: 33.0                 # Lado del marker ArUco interno, en
                                    # milímetros (típicamente 73% del cuadro).
    dict: "DICT_4X4_100"            # Nombre del dict ArUco (cv2.aruco.<dict>).
    legacy_pattern: true            # Enumeración de markers pre-OpenCV-4.6.
                                    # True matchea el layout de calib.io.
                                    # Pasar a false solo si generaste un
                                    # board con un OpenCV post-4.6.
    dual_pass_accept_threshold: 8   # Si detect_charuco_dual_pass detecta
                                    # <= este número de corners en el frame
                                    # original, reintenta con sharpen 3×3.
                                    # Subir (ej. 12) en sites con foco
                                    # marginal o iluminación pobre para
                                    # agresivar la recovery via sharpen.


# =============================================================================
# DETECTION — modelo + thresholds (model-specific, fleet-uniform tras lab tune)
# =============================================================================
detection:
  model_path: /usr/src/people-counter/models/people-counter-detector.hef
                                    # HEF compilado para Hailo-8L. people-counter-detector
                                    # es un YOLOv8n fine-tuneado cenital sobre
                                    # dataset multi-site con hard negatives
                                    # explícitos, entrenado en Kaggle T4 con
                                    # datos curados desde Roboflow. Ver
                                    # scripts/training/.
  confidence_threshold: 0.20        # Piso del score de detección de person/head.
                                    # Tuneado para people-counter-detector — corta
                                    # FPs del modelo (alucinaciones en piso vacío)
                                    # pero deja pasar cabezas estáticas (sentado)
                                    # que el modelo (sesgado por training set
                                    # motion-trigger) saca con scores ~0.20-0.28.
  low_confidence_threshold: 0.10    # Two-stage matching (estilo ByteTrack).
                                    # Detecciones en [low, confidence) entran
                                    # al tracker SOLO para re-asociar tracks
                                    # existentes que high-conf no matcheó.
                                    # Nunca crean tracks nuevos. Si no
                                    # matchean, se descartan silenciosamente.
                                    # Evita perder ID cuando una persona en
                                    # movimiento tiene un frame de motion blur
                                    # bajo el threshold y reaparece a alta
                                    # conf unos frames después. 0.10 deja
                                    # entrar detecciones de motion-blur reales
                                    # pero corta el ruido sub-0.10 del
                                    # detector (donde FPs y match bonafide se
                                    # vuelven indistinguibles). Debe ser
                                    # estricto < confidence_threshold. null
                                    # para volver al comportamiento single-stage.
  new_track_threshold: 0.35         # Spawn floor. Detecciones en
                                    # [confidence, new_track) pueden re-asociar
                                    # tracks existentes pero NO spawn nuevos.
                                    # Combina con low_confidence_threshold para
                                    # banda triple: <low descartado,
                                    # [low, new_track) match-only, >=new_track
                                    # spawn. Evita IDs fantasma cuando el
                                    # detector titubea sobre clutter al cruzar
                                    # el umbral mínimo. null para que spawn
                                    # caiga al confidence_threshold.
  nms_threshold: 0.45               # Threshold de IoU para non-maximum suppression.
  cluster_distance_px: 150          # Clustering por centroide post-NMS:
                                    # detecciones cuyos centroides caen dentro
                                    # de esta cantidad de pixels se mergean,
                                    # manteniendo la de mayor confidence.
                                    # Agarra el multi-firing en geometría
                                    # cenital donde head + torso + miembros
                                    # de la misma persona producen cajas
                                    # distintas que NMS no colapsa porque sus
                                    # IoUs pairwise son <0.45. 150px ~13% del
                                    # ancho a 1152×648; cabezas de ~50-80px a
                                    # mount 3m fittean cómodas + absorbe el
                                    # double-firing del modelo sobre heads
                                    # grandes (cuando la persona cruza cerca
                                    # del centro óptico). Dos personas codo-
                                    # a-codo (~50cm físico ≈ 130-150px) entran
                                    # en zona ambigua — si tu sitio espera
                                    # flujos con personas pegadas (peatonal
                                    # saturada, grupo familiar), bajar a 120.
                                    # 0 desactiva.

  # Static FP suppressor — defense-in-depth contra clutter estructural
  # (sombras estables, blobs aprendidos sobre maniquíes / ropa colgada
  # / sillas con prendas / posters con personas dibujadas que sobreviven
  # NMS y cluster-por-centroide). Cuadricula el frame en celdas y
  # suprime cualquier detección que caiga en una celda activa >=
  # hit_rate_threshold de los últimos `window_seconds`. Inactivo
  # durante warm-up para no filtrar antes de tener historia.
  #
  # ON por default: en retail real el clutter estructural es la norma
  # (mostradores, displays con maniquíes, sillas en el cuadro del ROI)
  # y el suppressor es la única defensa contra FPs persistentes que
  # generan counts fantasma. La ventana de 3s + min_samples=8 da margen
  # para que una persona quieta legítima salga del rango antes de
  # alcanzar el threshold. Apagar SOLO si se observa que se come
  # cabezas reales (zonas de espera donde la gente está parada >5s
  # mirando algo, colas largas).
  static_suppressor:
    enabled: true
    cell_size_px: 30                # Resolución espacial del filtro.
                                    # 30px funciona para 1152×648 con cabezas
                                    # ~50-80px (cada cabeza ocupa ~2-3 celdas).
    window_seconds: 3.0             # Ventana del análisis en segundos reales
                                    # (no en frames). El supresor mide la
                                    # ventana con timestamps internos, así
                                    # que el comportamiento es consistente
                                    # sea cual sea el FPS instantáneo del
                                    # pipeline. 3s da tiempo a un FP estable
                                    # para acumular hit rate alto sin
                                    # penalizar a una persona quieta.
    hit_rate_threshold: 0.7         # Fracción mínima para considerar la
                                    # celda hot. 0.7 separa FP estable (~1.0)
                                    # de presencia ocasional (~0.3-0.5).
    min_samples_for_judgment: 8     # Mínimo de frames con detecciones antes
                                    # de empezar a filtrar (ortogonal al gate
                                    # de tiempo). Evita decisiones con
                                    # estadística pobre en escenarios de FPS
                                    # bajísimo (ej. <3 fps, 3s window).


# =============================================================================
# COUNTER — ROI + N líneas direccionales (geometría per-site)
# =============================================================================
#
# Lifecycle: un track que entra al ROI, cruza una de las líneas
# configuradas en una dirección con label, y sale del ROI emite un evento
# con ese label. Los cruces en direcciones sin label se ignoran
# silenciosamente — así se modela un gate one-way (una puerta es IN-only,
# la otra OUT-only, o ambas direcciones en la misma línea).
#
# Ejemplos (coords sobre el frame canonical 1152×648):
#   * Una puerta, ambas direcciones cuentan (entrada de retail típica):
#       counter:
#         roi: { x_min: 356, x_max: 796, y_min: 264, y_max: 384 }
#         lines:
#           - from: [356, 324]
#             to:   [796, 324]
#             labels:
#               top_to_bottom: ingress
#               bottom_to_top: egress
#
#   * Dos puertas físicamente separadas (una IN, otra OUT):
#       counter:
#         roi: { x_min: 200, x_max: 952, y_min: 224, y_max: 424 }
#         lines:
#           - from: [220, 324]      # mitad izquierda — gate IN
#             to:   [560, 324]
#             labels: { top_to_bottom: ingress }
#           - from: [592, 324]      # mitad derecha — gate OUT
#             to:   [932, 324]
#             labels: { bottom_to_top: egress }
#
# Las líneas tienen que ser axis-aligned (horizontal: mismo y, vertical:
# mismo x). Keys de dirección válidas: las líneas horizontales usan
# top_to_bottom / bottom_to_top; las verticales usan left_to_right /
# right_to_left.
counter:
  # ROI centrado en frame 1152×648 (canonical). 440×120 px cubre el ancho
  # típico de una puerta de retail mounted a 2.5-3m; el operador después
  # ajusta per-site con scripts/roi_picker.py una vez instalado el equipo.
  roi:
    x_min: 356
    x_max: 796
    y_min: 264
    y_max: 384
  lines:
    - from: [356, 324]
      to:   [796, 324]
      labels:
        top_to_bottom: ingress
        bottom_to_top: egress

  # Classifier adulto/niño — basado en altura de cabeza sobre el piso (usa
  # depth estéreo + mounting_height_m). adult_min_m puede necesitar tuning
  # per-site según la demografía local.
  height_classifier:
    enabled: true
    adult_min_m: 1.55               # Altura de cabeza (m) >= esto => adulto,
                                    # si no, niño. 1.55m cae cerca del P25
                                    # de mujeres adultas en Argentina; pocos
                                    # adultos se misclasifican.

  # Proyección parallax de foot-point. Cuando true, el counter proyecta el
  # head pixel del bbox al foot-point via altura 3D antes de evaluar la
  # línea virtual + ROI. Corrige el parallax fisheye en geometrías donde
  # la puerta cae al borde del FOV (~1m de error a mount 3m). Default
  # false: requiere depth válido (calibración pasada por diagnose_depth.py)
  # — con depth incorrecto el head_height_mm queda mal y la proyección
  # comprime la trayectoria del foot-point dentro del ROI hasta que los
  # exits no disparan. Activar per-device después de validar que la
  # calibración estéreo da error <5% al centro a 2m.
  foot_projection_enabled: false

  # Debounce de cruce de línea — distancia mínima en pixels que el track
  # debe haberse movido entre frames consecutivos para considerar un flip
  # de lado como cruce real. 0 deshabilita el feature (default — preserva
  # comportamiento legacy). Valores típicos para 30 fps a 1m/s ≈ 10
  # px/frame: 2.0–3.0 filtra jitter del tracker cerca de la línea sin
  # rechazar movimiento normal. Activar per-site solo si se observa
  # doble-conteo por jitter en el piloto.
  min_crossing_movement_px: 0.0

  # U-turn cancellation usa el ROI como zona de cancelación: cuando un
  # evento de cruce cae dentro del ROI y existe un evento opuesto
  # reciente (≤5s, hardcoded) también dentro del ROI, ambos se cancelan
  # mutuamente. Captura "persona dudó en la entrada, cruzó y volvió
  # enseguida" así como fragmentación de track cerca de la línea
  # (track A cruza IN, jitter parte el track, track B cruza OUT) sin
  # contabilizar IN+OUT espurios. Activo automáticamente cuando hay
  # ROI configurado — sin params extra.


# =============================================================================
# WIFI/BLE — captura + dedup
# =============================================================================
wifi_ble:
  enabled: true                     # Master switch (overrideable desde cloud).
  ble_enabled: true                 # Captura de advertising BLE.
  rssi_passerby_threshold: -75      # Presente en la zona.
  rssi_shopper_threshold: -55       # Muy cerca / entró.

  # Constantes de protocolo — contrato cross-device fleet-wide de dedup.
  # No cambiar sin coordinar a lo largo de la flota (dividiría los buckets
  # de dedup).
  wifi_interface: wlan0             # CYW43455 onboard, modo monitor.
  probe_interval_seconds: 900       # Ventana de agregación. Default 900s (15min);
                                    # si no se setea, el publisher cae a
                                    # analytics.bucket_seconds.
  cross_protocol_window_seconds: 2  # Ventana de dedup WiFi+BLE same-device.
  cross_protocol_rssi_delta: 5      # |Delta RSSI| max para match cross-protocol.

  # --- Stitching de MACs randomizadas ---
  # iOS/Android rotan la MAC en probes cada ~2-15min para anti-tracking. Sin
  # stitching cada rotacion infla el conteo. Las dos reglas siguientes mergean
  # hashes en el mismo grupo de identidad. Privacy: seqnum y raw MACs quedan
  # SOLO en SQLite local del device, nunca van por MQTT (el publisher manda
  # counts agregados, no hashes ni seqnums).
  seqnum_stitching:
    enabled: true                   # Regla 1: continuidad del seqnum 802.11.
    window_seconds: 30              # Stitch dos MACs si su ultima observacion
                                    # cae en esta ventana.
    max_delta: 100                  # Maxima distancia (mod 4096) entre seqnums.
                                    # 100 ≈ 10s de actividad de un chip activo.
    rssi_delta: 5                   # Tolerancia de RSSI para el match.
  ble_anchor:
    enabled: true                   # Regla 3: BLE como ancla de identidad
                                    # durante la vida de un RPA.
    window_seconds: 900             # 15min ≈ vida tipica de un iOS BLE RPA.
                                    # Nuevas MACs WiFi con RSSI compatible al
                                    # BLE ancla durante ese tiempo se mergean.


# =============================================================================
# MQTT — AWS IoT Core (certs per-device + endpoint, shape de topic fleet-wide)
# =============================================================================
mqtt:
  endpoint: "xxxxx.iot.us-east-1.amazonaws.com"
  cert_path: "/etc/people-counter/certs/device.pem.crt"
  key_path: "/etc/people-counter/certs/device.pem.key"
  ca_path: "/etc/people-counter/certs/AmazonRootCA1.pem"
  port: 8883                        # Puerto TLS de AWS IoT Core.
  startup_jitter_seconds: 10.0      # Anti thundering-herd. Cuando la
                                    # flota entera bootea simultáneamente
                                    # tras un outage (incident regional,
                                    # mass restart de cadena retail) o
                                    # power cut sucursal-wide, todas las
                                    # devices piden TLS handshake al
                                    # mismo tiempo → DDoS al broker IoT.
                                    # Espera uniform[0, este valor] s
                                    # antes del initial connect. Corre en
                                    # thread background — connect()
                                    # retorna inmediatamente y los eventos
                                    # se bufferean local hasta connect.
                                    # 10s default es razonable para PoC y
                                    # flotas chicas (≤20 devices) y
                                    # minimiza la ventana en la que el
                                    # primer telemetry tick se ve como
                                    # ``mqtt_connected=False`` en logs.
                                    # Subir a 30s para flotas grandes
                                    # (50+ devices que pueden coincidir
                                    # en reboots).
                                    # 0 deshabilita (dev / single device).
  topics:
    counting:  "store/{store_id}/counting"
    wifi_ble:  "store/{store_id}/wifi_ble"
    telemetry: "store/{store_id}/telemetry"
    shadow:    "$aws/things/{device_id}/shadow"


# =============================================================================
# LOGGING + TELEMETRY + STATUS LED
# =============================================================================
logging:
  level: "INFO"                     # DEBUG / INFO / WARNING / ERROR.
  format: json                      # json | plain.
  file: /var/log/people-counter/app.log

telemetry:
  interval_seconds: 3600            # Cadencia de reporting de telemetría.
                                    # 3600s (1h) es razonable para PoC. Bajar
                                    # a 300s (5min) si necesitás ver tendencias
                                    # finas o detectar thermal throttle rápido.

status_led:
  enabled: true                     # LED RGB de status por GPIO.


# =============================================================================
# CONFIG PUSHEABLE DESDE CLOUD (AWS IoT Device Shadow)
# =============================================================================
# Los defaults de abajo se aplican al boot si el shadow del cloud no está
# disponible. El shadow tiene precedencia en runtime cuando se puede alcanzar.
#
# Para pushear un cambio:
#   aws iot-data update-thing-shadow --thing-name <device_id> \
#     --payload '{"state":{"desired":{"operating_hours":{"monday":"10:00-22:00"}}}}'
# =============================================================================
cloud_defaults:
  operating_hours:
    monday: "10:00-22:00"
    tuesday: "10:00-22:00"
    wednesday: "10:00-22:00"
    thursday: "10:00-22:00"
    friday: "10:00-22:00"
    saturday: "10:00-22:00"
    sunday: "10:00-21:00"

  # fail_open: loguea WARNING, sigue contando (default — sin pérdida de datos
  # ante un typo).
  # fail_closed: loguea CRITICAL, pausa el conteo hasta que se pushee un
  # schedule válido.
  on_invalid_schedule: "fail_open"

  footfall_scaling_factor: 1.0
  counting_enabled: true
  wifi_ble_enabled: true


# =============================================================================
# AVANZADO — tuning de algoritmo. Tocar solo si sabés lo que estás haciendo.
# =============================================================================


# --- Constantes de hardware (FÍSICO — seteado en lab, jamás per-site) -------
# Cada device construido según spec tiene los mismos valores acá. Si te
# encontrás queriendo cambiar algo, tenés un defecto de hardware, un build
# no-estándar, o un malentendido — investigá antes de editar.
bracket:
  baseline_mm: 140                  # Distancia mecánica entre los centros de
                                    # los lentes L↔R. Determinada por el corte
                                    # del bracket en fab. El baseline del
                                    # .npz de calibración tiene que matchear
                                    # esto dentro de ±5mm — la divergencia
                                    # indica calibración degenerada o
                                    # bracket dañado.
  camera_left_csi: 0                # Índice del CSI bus para el lens IZQUIERDO
                                    # (mirando desde la cámara hacia la escena).
  camera_right_csi: 1               # Índice del CSI bus para el lens DERECHO.

sensor:
  model: imx708
  full_res: [4608, 2592]            # Resolución full nativa.
  default_res: [2304, 1296]         # 2x2 binned, full FOV — modo canónico
                                    # para foco y calibración. Detección de
                                    # ChArUco ~4× más rápida que full-res
                                    # 4608×2592 (≥8 FPS vs <2 FPS en Pi 5),
                                    # el binning 2x2 mejora SNR, el par
                                    # rectificado más SGBM igual cabe en el
                                    # budget runtime a esta resolución.
  default_fps: 15                   # Max FPS estable a default_res con dos
                                    # instancias picamera2. Lo usa la tool
                                    # de calibración. El pipeline runtime usa
                                    # vision.fps de arriba (típicamente más
                                    # rápido porque la res runtime es un
                                    # downscale).
  nominal_focal_full_px: 2050       # Focal pinhole-equivalente a full_res,
                                    # región central. Se usa como K inicial
                                    # para el bootstrap de calibración y para
                                    # estimación de distancia en focus_assist.

lens:
  type: m12_120deg                  # Arducam B0310 (M12 mount, 120° HFOV /
                                    # 152° diag, fisheye Kannala-Brandt).
  hfov_deg: 120


# --- Head-depth pick gate (anthropometric, mount-aware) ---------------------
# Bounds en altura-sobre-piso que `head_depth_in_bbox` usa para decidir qué
# rango de profundidades dentro del bbox podría ser una cabeza humana. Cualquier
# knob acepta "auto" o un valor literal en metros:
#   auto → se calcula como min(anthropometric_default, mount - clearance)
#   <float> → valor literal en m (override manual)
# Para mounts de retail típicos (2.5-4m) el anthropometric gana y los valores
# resueltos son los defaults; el cap geométrico solo entra para mounts inusuales
# (muy bajos) donde el default haría que el gate colapse.
head_depth:
  max_head_height_m: auto           # auto = min(1.80, mount - 0.30).
                                    # P95 masculino global ~1.83m. Cap
                                    # geométrico deja 30cm de near-range para
                                    # SGBM. Override manual: float.
  min_head_above_floor_m: 0.50      # Floor del head — anthropometric puro,
                                    # no depende de mount. Cabeza humana
                                    # plausible está al menos 50cm del piso
                                    # (excluye niños gateando + objetos al ras).
  column_radius_m: 0.25             # Radio (m) de la columna vertical 3D
                                    # centrada en el centroide del cuerpo.
                                    # Pixels cuyo (X, Y) métrico back-projecta
                                    # fuera de esta columna se descartan antes
                                    # del histograma — rechaza estructura
                                    # overhead (cables, cornisas, bordes de
                                    # mueble) que cae dentro del bbox 2D pero
                                    # está físicamente offset en X o Y respecto
                                    # del cuerpo. 25cm cubre cabezas reales
                                    # con holgura. Subir a >1m efectivamente
                                    # desactiva el filtro espacial.
  blob_percentile: 75               # Percentile (0-100) sobre los depths del
                                    # blob de cabeza más grande dentro del slice
                                    # nearest del histograma. 75 captura la
                                    # superficie típica del cráneo y es robusto
                                    # a speckle near-camera de SGBM sobre hair
                                    # fluff (pixels cercanos con contraste
                                    # alto que se cuelan en el mismo bin que
                                    # la cabeza real y, con mediana, tiran el
                                    # depth promedio hacia abajo → height
                                    # sobre-estimada por ~3-5cm). 50 = mediana.


# --- Height sanity filter (defensa post-tracker) ----------------------------
# Después de que head_depth_in_bbox + classifier corren, el evento de conteo
# igual se emite si una persona cruzó la línea — pero si la altura calculada
# es físicamente imposible (overhead structure que pasó el primer gate,
# calibration drift, edge cases), height_m se limpia a None y height_class
# cae a "unknown" para que los dashboards no surface valores falsamente
# confiados. Distinto del adult_min_m del classifier: ese decide adult/child
# dentro del rango plausible; este descarta solo lo imposible.
height:
  sanity_min_m: 0.80                # Lower bound. Por debajo: piso, niño muy
                                    # chico con bbox fallado, ruido.
                                    # Anthropometric, no depende de mount.
  sanity_max_m: auto                # auto = min(2.10, mount - 0.20). Override
                                    # manual: float. P99 global ~1.92m, 2.10
                                    # deja headroom; cap geométrico solo activo
                                    # en mounts muy bajos.


# --- Tracker + state machine (tuning de algo, fleet-uniform tras piloto) ----
tracking:
  max_disappeared_frames: 30        # Frames que un track puede miss antes de drop.
  max_distance_px: 100              # Distancia max en px para asociación
                                    # frame-a-frame. A 26 fps con caminata
                                    # rápida (~3 m/s ≈ 35 px/frame a mount
                                    # 2.55m / 1152×648), 100 cubre hasta
                                    # ~5 m/s con holgura sin abrir cross-id
                                    # entre personas adyacentes. Valores
                                    # más bajos (50-70) fragmentan tracks
                                    # en motion blur → más PENDING → más
                                    # unknowns de height. Escalar
                                    # linealmente con la resolución runtime
                                    # si la cambiás.
  state_machine:
    confirm_frames: 2               # Hits para promover CANDIDATE -> CONFIRMED.
                                    # 2 frames es el sweet spot: filtra FPs
                                    # de 1 frame (flicker) pero spawna lo bastante
                                    # rápido para que el bbox aparezca antes del
                                    # ROI a velocidad de caminata (a 12 fps son
                                    # ~150ms = ~21cm, holgura suficiente sobre
                                    # ROIs típicos). Combinado con
                                    # static_suppressor + cluster_distance_px,
                                    # los FPs sostenidos también se filtran sin
                                    # necesidad de subir a 3. Bajar a 1 solo si
                                    # el detector tiene dropeos agresivos
                                    # frame-a-frame; subir a 3 si static_suppressor
                                    # está OFF en el sitio y se ven ghosts.
    pending_max_frames: 30          # Misses antes de PENDING -> LOST. A
                                    # 26 fps son ~1.15s para recovery.
                                    # Mantener generoso reduce track
                                    # fragmentation cuando el detector
                                    # tiene misses esporádicos sobre la
                                    # misma cabeza — confidence medianas
                                    # más largas por track → mejor
                                    # estimación de altura.
    reid_gate_px: 200               # Gate de distancia para re-id en PENDING.
                                    # 200px (~17% del ancho a 1152×648) cubre
                                    # gaps de detección de hasta ~1s a
                                    # velocidad de caminata. Pareado con
                                    # pending_velocity_decay que congela el
                                    # predict cerca de la última observación,
                                    # así el gate no necesita ser más ancho.
    depth_gate_m: 0.5               # Gate de |Δz| para re-id cross frames.
    ambiguous_match_ratio: 0.8      # Ratio test Lowe-style post-Hungarian
                                    # — defensa anti-ID-swap en cruces.
                                    # Rechaza un match cuando el 2do-mejor
                                    # alternativa (otra detección para el
                                    # mismo track o otro track para la
                                    # misma detección) está dentro de este
                                    # ratio del costo del best. Con 0.8,
                                    # rechaza si best > 0.8 * second_best
                                    # (= 2do está dentro del 25% del 1ro).
                                    # Tracks rechazados van a PENDING;
                                    # detecciones rechazadas se consumen
                                    # (no spawnean nuevos IDs) — preferimos
                                    # perder una obs ambigua a duplicar
                                    # IDs por una asignación incierta.
                                    # 1.0 desactiva (back-compat). Bajar
                                    # a 0.6-0.7 en sites con cruces muy
                                    # cerrados donde aceptamos miss extra
                                    # a cambio de cero swaps.
    pending_grace_frames: 3         # Frames iniciales de PENDING en los
                                    # que se PRESERVA velocidad completa
                                    # antes de empezar el decay. Modela
                                    # oclusiones cortas (carrito que pasa
                                    # ~250ms = 3 frames a 12 fps, motion
                                    # blur de 1-2 frames, estructura
                                    # overhead efímera). Sin grace, el
                                    # decay desde el primer miss congela
                                    # el predict atrás del lugar real y
                                    # rompe el reid cuando la persona
                                    # reaparece adelante. Con grace, los
                                    # primeros N frames extrapolan honest
                                    # a la velocidad observada (drift
                                    # transitorio aceptado) y recién
                                    # después arranca el decay si la
                                    # pausa se extiende. 0 = decay desde
                                    # frame 1 (back-compat / sites sin
                                    # oclusiones donde no necesitamos
                                    # extrapolar agresivo).
    pending_velocity_decay: 0.85    # Factor multiplicativo aplicado a (vx, vy)
                                    # del Kalman cada frame en estado PENDING.
                                    # 0.85 → velocidad colapsa a ~10% en 15
                                    # frames (~1.2s a 12 fps), decay gradual
                                    # en vez de freeze inmediato. Tradeoff
                                    # crítico: valores agresivos (0.3-0.5)
                                    # congelan la posición predicha demasiado
                                    # rápido y rompen el reid cuando una
                                    # persona se ocluye 1s detrás de un
                                    # carrito o cartel (predict queda atrás,
                                    # detección reaparece adelante fuera del
                                    # reid_gate_px → spawn de track fantasma
                                    # con last_label cacheado del track viejo,
                                    # mismo síntoma del PENDING-atrapado-en-
                                    # ROI). 0.85 mantiene velocidad útil para
                                    # cubrir oclusiones cortas de caminata
                                    # normal sin extrapolar indefinidamente.
                                    # 0.7-0.9 es el rango razonable para
                                    # retail con flujo en movimiento;
                                    # bajar a 0.3-0.5 solo en sites donde
                                    # la gente se queda parada largamente
                                    # (probadores, mostradores con cola).
    kalman:                         # Filtro Kalman de velocidad constante
                                    # sobre el estado [cx, cy, vx, vy] de
                                    # cada track. Tolera gaps del detector de
                                    # varios frames a baja FPS sin perder el
                                    # match cuando la detección reaparece.
      process_noise: 1.0            # Diagonal de Q — incertidumbre del
                                    # modelo (px²/frame²). Más alto = dejar
                                    # que la velocidad flexione más entre
                                    # frames; más bajo = confiar más fuerte
                                    # en movimiento de línea recta.
      measurement_noise: 5.0        # Diagonal de R — ruido de posición
                                    # del detector (px). ~5 px es típico
                                    # para YOLOv8n cenital con bboxes bien
                                    # confirmados.
      initial_velocity_uncertainty: 100.0
                                    # Diagonal de P para vx/vy al init del
                                    # track. Alta porque todavía no
                                    # observamos dirección — colapsa con la
                                    # primera medición.


# --- Convención de persistencia local ---------------------------------------
buffer:
  db_path: /var/lib/people-counter/buffer.db
  max_age_hours: 72                 # Edad máxima (en horas) que un mensaje
                                    # unsent puede vivir antes de ser purgado.
                                    # 72h = 3 días: tiempo razonable para
                                    # recovery operacional ante outage de
                                    # AWS/Internet sin que se acumule data
                                    # demasiado vieja.
  max_backlog: 50000                # Cap absoluto del número de mensajes
                                    # unsent en backlog. Si el cap se
                                    # excede (cloud unreachable por días),
                                    # los más viejos se dropean para que
                                    # el disco no se llene. 50k a ~500
                                    # bytes/msg ≈ 25MB. Bounded data loss
                                    # > disk fill. 0 deshabilita el cap.


# --- Selector best-frame (data active-learning, default-OFF con awareness GDPR/LPDP) -
# Cuando se habilita, por cada count event guarda 1 JPG representativo del
# track al cruzar la línea. El JPG vive solo on-device (jamás transmitido,
# jamás publicado por MQTT — solo el path va en el evento como metadata),
# retención enforceada por systemd timer + scripts/purge_best_frames.py,
# propósito acotado a debugging + active learning durante piloto. Default
# OFF para que zero-storage / zero-PII sea el comportamiento out-of-the-box;
# activar requiere DPIA + cartelería + política de privacidad acompañando.
# Ver docs/privacy.md para el procedimiento legal.
best_frame:
  enabled: false                    # Toggle a true SOLO con DPIA + cartelería
                                    # + política de privacidad activa.
  output_dir: /var/lib/people-counter/best_frames
  retention_days: 7                 # Purgado por scripts/purge_best_frames.py
                                    # vía systemd timer (people-counter-purge-
                                    # best-frames.timer, diario a las 03:30).
  buffer_size: 20                   # Max frames buffereados por track activo.
                                    # Rotativo: cuando se llena descarta el
                                    # más viejo. Cap en memoria — no buffer
                                    # en disco intermedio.
  jpeg_quality: 85                  # cv2.IMWRITE_JPEG_QUALITY. 85 es el
                                    # sweet spot calidad/tamaño para training.
  scoring:                          # Pesos del score; suman ~1.0 idealmente.
    confidence_weight: 0.4          # Confianza del detector — más alta es
                                    # mejor candidato.
    bbox_area_weight: 0.2           # Área del bbox normalizada al frame.
                                    # Más grande = persona más cerca = más
                                    # detalle aprovechable.
    centrality_weight: 0.2          # Cercanía al centro del frame. Menos
                                    # distorsión fisheye en el centro.
    sharpness_weight: 0.2           # Varianza Laplaciana del crop del bbox.
                                    # Más alta = menos motion blur.
