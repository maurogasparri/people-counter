# =============================================================================
# People Counter — Per-Device Configuration
# =============================================================================
#
# Configuration strategy:
#
# HARDWARE (config/hardware.yaml — committed) — Fleet invariants. Bracket
#   geometry, sensor defaults, SGBM/detection/tracking tuning, MQTT contract,
#   buffer/log paths. Set once in lab; never touched per-site.
#
# THIS FILE (/etc/people-counter/config.yaml — per-device) — Per-site
#   identity, geometry, credentials, and operational policies. Rarely edited
#   after install except via the cloud shadow.
#
# CLOUD (AWS IoT Device Shadow) — Business-driven values inside the
#   `cloud_defaults` block, pushed remotely without SSH. Whitelisted runtime-
#   safe keys also apply live (see RUNTIME_SAFE_KEYS in src/config/loader.py).
#
# Any key that appears here AND in hardware.yaml: this file wins. The
# fallback to hardware.yaml only kicks in when the key is missing here.
# =============================================================================

# --- Device identity (set once during provisioning) ---
device:
  id: "store-001-cam-01"          # Unique device ID (matches IoT Core thing name)
  store_id: "store-001"           # Site/store identifier
  store_name: "Store Name"        # Human-readable (display only)

# --- Camera + per-site geometry ---
# Bracket geometry (baseline, L/R CSI assignment) and sensor defaults
# (model, full_res, default_res, default_fps, nominal focal) live in
# config/hardware.yaml — those are invariants set by the bracket assembly
# procedure.
vision:
  # Optional: override the hardware default resolution. MUST match the
  # resolution of the calibration .npz; mismatched resolution silently
  # corrupts depth. Leave commented to use sensor.default_res.
  # resolution: [1152, 648]
  # fps: 15                       # Optional: override sensor.default_fps
  calibration_file: "/etc/people-counter/calibration.npz"
  mounting_height_m: 3.0          # Camera mount height from floor in meters.
                                  # Drives auto num_disparities + height classifier.
  # SGBM overrides (rare — defaults in hardware.yaml.vision_runtime.sgbm).
  # Leave commented unless a specific deployment needs to deviate.
  # num_disparities: auto
  # block_size: 9
  # sgbm_downscale: 2

# --- Detection model ---
# Thresholds (confidence, NMS) live in hardware.yaml.detection. Only the
# install path is per-device (HEF location on filesystem).
detection:
  model_path: "/usr/src/people-counter/models/yolov8n.hef"

# --- Counter (ROI + virtual line) — site geometry ---
# Counts a track only when it exits the ROI on the opposite side of where it
# entered, having crossed the line in between. Tracks that enter and leave on
# the same side (or never cross the line) are "indeciso" and not counted.
counter:
  roi:
    x_min: 100
    x_max: 540
    y_min: 180
    y_max: 300
  line:
    orientation: horizontal       # horizontal | vertical
    position: 240                 # y-coord if horizontal, x-coord if vertical
  direction_labels:
    side_a_to_b: ingress          # entered side_a, exited side_b -> this label
    side_b_to_a: egress
  # Tracker state-machine overrides — defaults in
  # hardware.yaml.tracking.state_machine. Uncomment only to deviate.
  # tracker:
  #   confirm_frames: 3
  #   pending_max_frames: 5
  #   reid_gate_px: 60
  #   depth_gate_m: 0.5

# --- WiFi/BLE — site privacy + sensitivity ---
# Protocol constants (interface, intervals, cross-protocol windows) live in
# hardware.yaml.wifi_ble. The toggles + RSSI thresholds stay here because
# privacy/legal toggles and RSSI noise floor are site-dependent.
wifi_ble:
  enabled: true                   # Master switch (overridable from cloud)
  ble_enabled: true               # BLE advertising capture
  # Dual RSSI thresholds:
  #   passerby = -75 dBm → present in the zone
  #   shopper  = -55 dBm → very close / entered
  rssi_passerby_threshold: -75
  rssi_shopper_threshold: -55

# --- MQTT — endpoint + per-device certs ---
# Port (8883) and topic templates live in hardware.yaml.mqtt (fleet-wide
# protocol contract). Certs are per-device, set during provisioning.
mqtt:
  endpoint: "xxxxx.iot.us-east-1.amazonaws.com"
  cert_path: "/etc/people-counter/certs/device.pem.crt"
  key_path: "/etc/people-counter/certs/device.pem.key"
  ca_path: "/etc/people-counter/certs/AmazonRootCA1.pem"

# --- Logging level (operator-tunable for debug) ---
# Format/file convention live in hardware.yaml.logging.
logging:
  level: "INFO"

# --- Telemetry interval (cloud-overridable) ---
telemetry:
  interval_seconds: 300           # Report CPU temp, uptime, etc. every 5 min

# --- Status LED (per-site aesthetics) ---
# Field-visible operator indicator. Set enabled=false to silence the LED if
# it's visually intrusive at the deploy site (e.g. retail aesthetics, dim
# corner where the brightness bothers customers).
status_led:
  enabled: true

# =============================================================================
# CLOUD-PUSHED CONFIG (AWS IoT Device Shadow)
# =============================================================================
# These values are defaults. On startup the device fetches its IoT Shadow
# and merges cloud values over these. Cloud takes precedence.
#
# To push a change:
#   aws iot-data update-thing-shadow --thing-name <device_id> \
#     --payload '{"state":{"desired":{"operating_hours":{"monday":"10:00-22:00"}}}}'
#
# The device subscribes to shadow/update/delta and applies changes at runtime.
# =============================================================================
cloud_defaults:
  # Operating hours per day of week. Site-level config — the cloud pushes
  # the same schedule to all devices in a store.
  # Format: "HH:MM-HH:MM" or null for closed
  operating_hours:
    monday: "10:00-22:00"
    tuesday: "10:00-22:00"
    wednesday: "10:00-22:00"
    thursday: "10:00-22:00"
    friday: "10:00-22:00"
    saturday: "10:00-22:00"
    sunday: "10:00-21:00"

  # Behavior when operating_hours is malformed (bad HH:MM, end before start,
  # wrong type, etc.). Default fail_open keeps counting to avoid losing data
  # on a config typo; fail_closed pauses counting until a valid schedule is
  # pushed, trading false positives for strict adherence.
  #   fail_open   — log WARNING once, continue counting (default, back-compat)
  #   fail_closed — log CRITICAL, pause counting, keep service alive for
  #                 telemetry and shadow re-config
  on_invalid_schedule: "fail_open"

  # Post-calibration correction multiplier. Default 1.0 = no correction.
  footfall_scaling_factor: 1.0

  # Runtime overrides (can be toggled from cloud without SSH)
  counting_enabled: true          # Pause counting during maintenance
  wifi_ble_enabled: true          # Disable WiFi/BLE for legal/privacy reasons
  telemetry_interval_seconds: 300 # Can be reduced for debugging

  # Adult/child classifier based on head height above floor. Derived from
  # stereo depth + local mounting_height_m. Disabled by default.
  counter:
    height_classifier:
      enabled: false              # Toggle from cloud per-store
      adult_min_m: 1.55           # Head height (m) — >= threshold → "adult", else "child". 1.55m is near the P25 of adult women in Argentina, so few adults are misclassified as children. Tall children (<12) rarely exceed it. Adjust per site if your demographics differ.

