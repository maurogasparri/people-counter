# People Counter — wlan0 fuera de NetworkManager.
#
# wlan0 (CYW43455 onboard) se dedica EXCLUSIVAMENTE a WiFi probing en monitor
# mode; la red/uplink MQTT va por Ethernet (eth0). Si NetworkManager administra
# wlan0, al inicializarse en el boot la re-bloquea via rfkill justo después de
# nuestro unblock (race), y `ip link set wlan0 up` falla con
# "Operation not possible due to RF-kill" → el monitor mode nunca arranca.
#
# Marcando wlan0 como unmanaged, NM la ignora por completo: no la re-bloquea,
# no le levanta wpa_supplicant, y nuestro unblock + `iw set type monitor`
# quedan estables. eth0 sigue administrada normalmente.
#
# Deploy: copiar a /etc/NetworkManager/conf.d/99-unmanage-wlan0.conf y
# `nmcli general reload` (o reiniciar NetworkManager).
[keyfile]
unmanaged-devices=interface-name:wlan0
