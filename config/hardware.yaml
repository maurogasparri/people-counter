# Hardware-design constants.
#
# **DO NOT EDIT** — these are invariants of the people-counter bracket and
# sensors. Every device built to spec has the same values here. If you find
# yourself wanting to change something in this file, you have a hardware
# defect, a non-standard build, or a misunderstanding — investigate before
# editing, otherwise you risk silently breaking calibration or depth.
#
# This file ships with the codebase. Per-site / per-device settings live
# in /etc/people-counter/config.yaml — those are the ones operators tune.

bracket:
  baseline_mm: 140                # Mechanical L↔R lens center distance.
                                  # Determined by the bracket cut at fabrication.
                                  # Calibration .npz baseline must match this
                                  # within ±5mm — divergence indicates either
                                  # a degenerate calibration or a damaged bracket.
  camera_left_csi: 0              # CSI bus index for the LEFT lens (looking from
                                  # the camera into the scene). Determined by
                                  # which physical CSI port the left ribbon is
                                  # plugged into during assembly.
  camera_right_csi: 1             # CSI bus index for the RIGHT lens.

sensor:
  model: imx708
  full_res: [4608, 2592]          # Native full resolution.
  default_res: [2304, 1296]       # 2x2 binned, full FOV — the canonical mode for
                                  # focus and calibration. Chosen because ChArUco
                                  # detection runs ~4× faster than at full-res
                                  # 4608×2592 (≥8 FPS vs <2 FPS on Pi 5), the
                                  # 2x2 bin improves SNR, and the rectified pair
                                  # plus SGBM still fit in the runtime budget at
                                  # this resolution.
  default_fps: 15                 # Max stable FPS at default_res with two
                                  # picamera2 instances. Used by the calibration
                                  # tool. The runtime pipeline uses
                                  # vision_runtime.fps below (typically faster
                                  # because runtime res is a downscale of this).
  nominal_focal_full_px: 2050     # Pinhole-equivalent focal length at full_res,
                                  # center region. Used as starting K for
                                  # calibration bootstrap and for distance
                                  # estimation in focus_assist.

lens:
  type: m12_120deg                # Arducam B0310 (M12 mount, 120° HFOV / 152° diag,
                                  # fisheye Kannala-Brandt model).
  hfov_deg: 120

# =============================================================================
# Fleet-uniform runtime tuning
# =============================================================================
# Everything below is decided at lab and is the same for every device built
# to spec. Keys can still be overridden remotely via the cloud shadow when
# whitelisted in src/config/loader.py — those overrides land in config[...]
# at runtime, and main.py reads as `config[...].get(key, hw[...][key])` so
# the cloud value wins when present and the lab default applies otherwise.

# --- Runtime capture + stereo depth ---
vision_runtime:
  resolution: [1152, 648]         # Runtime resolution (downscale of sensor.default_res).
                                  # 1152×648 keeps the binned full-FOV geometry
                                  # while quartering the SGBM cost vs default_res.
                                  # Calibration .npz must be rescaled to match
                                  # via scripts/rescale_calibration.py.
  fps: 30                         # Capture frame rate at runtime resolution.
  calibration_file: /etc/people-counter/calibration.npz
                                  # Stereo calibration .npz path. The contents
                                  # are per-device (each pair has its own
                                  # extrinsics) but the path is the same on
                                  # every install.
  sgbm:
    num_disparities: auto         # "auto" derives from mounting_height_m +
                                  # runtime resolution. Multiple-of-16 int
                                  # to override (rare, diagnostic only).
    block_size: 9                 # Odd, 5..15.
    downscale: 4                  # 1=full, 2=half, 4=quarter, 8=eighth.
                                  # 4 was chosen over 8 after pilot tests
                                  # showed downscale=8 produced enough SGBM
                                  # speckle within the head-region bbox to
                                  # bias the depth median upward when a
                                  # person was standing still — manifested
                                  # as inflated head-height readings (e.g.
                                  # 1.94 m for a sitting user). Halving the
                                  # downscale doubles the disparity grid
                                  # resolution and largely removes that
                                  # noise. SGBM cost is ~4× downscale=8 but
                                  # still fits the runtime budget on Pi 5.

# --- Detection thresholds (model-specific, fleet-uniform after lab tune) ---
detection:
  architecture: rapid             # Postprocessor selector: "yolov8" (raw or
                                  # Hailo built-in NMS) or "rapid" (rotated-
                                  # bbox head, anchors decoded on CPU). The
                                  # registry in src/vision/detect.py maps the
                                  # name to its expected input size + decode
                                  # path. Producción usa "rapid" pareado con
                                  # rapid_mwhb1024.hef. "yolov8" se mantiene
                                  # disponible como baseline de comparación.
  model_path: /usr/src/people-counter/models/rapid_mwhb1024.hef
                                  # HEF compiled for Hailo-8L. Same path on
                                  # every device; the .hef itself is shipped
                                  # with the install.
  confidence_threshold: 0.30      # Person/head detection score floor.
                                  # Tuneado para RAPiD MWHB1024 — corta FPs
                                  # del modelo (alucinaciones en piso vacío).
                                  # El baseline YOLOv8n stock usaba 0.15.
  nms_threshold: 0.45             # IoU threshold for non-maximum suppression.
  cluster_distance_px: 200        # Post-NMS centroid clustering: detections
                                  # whose centroids fall within this many
                                  # pixels are merged, keeping the highest-
                                  # confidence one. Catches stock YOLOv8's
                                  # multi-firing on cenital geometry (head +
                                  # torso + limbs of the same person produce
                                  # distinct boxes that NMS doesn't collapse
                                  # because their pairwise IoUs are <0.45).
                                  # 150 covers the wider patterns where the
                                  # second box lands on an extended limb
                                  # 100-150 px from the head; 100 left those
                                  # cases as duplicates. Two real people 60
                                  # cm apart at 2.56 m mount give centroids
                                  # ~350 px apart, so 150 still has comfortable
                                  # headroom against false merges. 0 disables.

# --- Head-depth pick gate (anthropometric, mount-aware) ---
# Bounds en altura-sobre-piso que `head_depth_in_bbox` usa para decidir
# qué rango de profundidades dentro del bbox podría ser una cabeza
# humana. Cualquier knob acepta "auto" o un valor literal en metros:
#   auto → se calcula como min(anthropometric_default, mount - clearance)
#   <float> → valor literal en m (override manual)
# Para mounts de retail típicos (2.5-4m) el anthropometric gana y los
# valores resueltos son los defaults; el cap geométrico solo entra
# para mounts inusuales (muy bajos) donde el default haría que el
# gate colapse.
head_depth:
  max_head_height_m: auto         # auto = min(1.80, mount - 0.30)
                                  # P95 masculino global ~1.83m. Cap
                                  # geométrico deja 30cm de near-range
                                  # para SGBM. Override manual: float.
  min_head_above_floor_m: 0.50    # Floor del head — anthropometric
                                  # puro, no depende de mount. La
                                  # cabeza humana plausible está al
                                  # menos 50cm del piso (excluye niños
                                  # gateando + objetos al ras).

# --- Height sanity filter (defensa post-tracker, fleet-uniform) ---
# Después de que head_depth_in_bbox + classifier corren, el evento de
# conteo igual se emite si una persona cruzó la línea — pero si la
# altura calculada es físicamente imposible (overhead structure que
# pasó el primer gate, calibration drift, edge cases), height_m se
# limpia a None y height_class cae a "unknown" para que los dashboards
# no surface valores falsamente confiados. Distinto del adult_min_m
# del classifier: ese decide adult/child dentro del rango plausible;
# este descarta solo lo imposible. Mismo patrón auto/manual que
# head_depth — más permisivos para que sea net de seguridad real.
height:
  sanity_min_m: 0.80              # Lower bound. Por debajo: piso,
                                  # niño muy chico con bbox fallado,
                                  # ruido. Anthropometric, no depende
                                  # de mount.
  sanity_max_m: auto              # auto = min(2.10, mount - 0.20).
                                  # Override manual: float. P99 global
                                  # ~1.92m, 2.10 deja headroom; cap
                                  # geométrico solo activo en mounts
                                  # muy bajos.

# --- Tracker + state machine (algo tuning, fleet-uniform after pilot) ---
tracking:
  max_disappeared: 30             # Frames a track can miss before drop.
  max_distance: 50                # Max px distance for frame-to-frame
                                  # association. Scale linearly with
                                  # runtime resolution if you change it.
  state_machine:
    confirm_frames: 1             # Hits to promote CANDIDATE -> CONFIRMED.
                                  # Tuned aggressive (1) for the current YOLO
                                  # stock that has gappy detections; with a
                                  # fine-tuned detector this raises back to
                                  # 3 for less false-positive churn.
    pending_max_frames: 20        # Misses before PENDING -> LOST.
    reid_gate_px: 300             # Re-id distance gate. Wide because the
                                  # tracker is single-camera and the YOLO
                                  # stock occasionally drops the track for
                                  # several frames between re-detections.
    depth_gate_m: 0.5             # |Δz| gate for re-id across frames.

# --- WiFi/BLE protocol constants (cross-device dedup contract) ---
wifi_ble:
  wifi_interface: wlan0           # CYW43455 onboard, monitor mode.
  probe_interval_seconds: 900     # 15-min aggregation window.
  cross_protocol_window_seconds: 2
  cross_protocol_rssi_delta: 5

# --- MQTT protocol contract (topic shape is fleet-wide) ---
mqtt:
  port: 8883                      # AWS IoT Core TLS.
  topics:
    counting:  "store/{store_id}/counting"
    wifi_ble:  "store/{store_id}/wifi_ble"
    telemetry: "store/{store_id}/telemetry"
    shadow:    "$aws/things/{device_id}/shadow"

# --- Local persistence convention ---
buffer:
  db_path: /var/lib/people-counter/buffer.db
  max_age_hours: 72

# --- Best-frame selector (active-learning data, GDPR/LPDP-aware default-off) ---
# Cuando se habilita, por cada count event guarda 1 JPG representativo del
# track al cruzar la línea. El JPG vive solo on-device (jamás transmitido,
# jamás publicado por MQTT — solo el path va en el evento como metadata),
# retención enforceada por systemd timer + scripts/purge_best_frames.py,
# propósito acotado a debugging + active learning durante piloto. Default
# OFF para que zero-storage / zero-PII sea el comportamiento out-of-the-box;
# activar requiere DPIA + cartelería + política de privacidad acompañando.
# Ver docs/privacy.md para el procedimiento legal.
best_frame:
  enabled: false                  # Toggle a true SOLO con DPIA + cartelería
                                  # + política de privacidad activa.
  output_dir: /var/lib/people-counter/best_frames
  retention_days: 7               # Purgado por scripts/purge_best_frames.py
                                  # vía systemd timer (people-counter-purge-
                                  # best-frames.timer, daily 03:30).
  buffer_size: 20                 # Max frames buffereados por track activo.
                                  # Rotativo: cuando se llena descarta el
                                  # más viejo. Cap en memoria — no buffer
                                  # en disco intermedio.
  jpeg_quality: 85                # cv2.IMWRITE_JPEG_QUALITY. 85 es el
                                  # sweet spot calidad/tamaño para training.
  scoring:                        # Pesos del score; suman ~1.0 idealmente.
    confidence_weight: 0.4        # Confianza del detector — más alta es
                                  # mejor candidato.
    bbox_area_weight: 0.2         # Área del bbox normalizada al frame.
                                  # Más grande = persona más cerca = más
                                  # detalle aprovechable.
    centrality_weight: 0.2        # Cercanía al centro del frame. Menos
                                  # distorsión fisheye en el centro.
    sharpness_weight: 0.2         # Varianza Laplaciana del crop del bbox.
                                  # Más alta = menos motion blur.

# --- Logging convention (operator may still override `level` in config.yaml) ---
logging:
  format: json
  file: /var/log/people-counter/app.log
