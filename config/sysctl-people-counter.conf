# sysctl drop-in — deploy a /etc/sysctl.d/99-people-counter.conf
#
# Tuneo del kernel para el workload del pipeline de visión + WiFi/BLE +
# MQTT. Las dos prioridades operacionales son: (1) no tocar swap (microSD
# lenta = latency regression en inferencia); (2) mantener buffers/cache
# saludable para SQLite + journal sin que crezca sin control y robe RAM.
#
# Formato sysctl: `key = value`. Los comentarios solo en líneas propias
# (NO inline) — algunos parsers de sysctl interpretan todo después del
# `=` como parte del valor.

# Desincentiva uso de swap (default Pi OS = 60). Con swappiness=10 el kernel
# prefiere dropear page cache antes que paginar páginas anónimas a swap.
# Critico para Pi 5 2GB: si el sistema empieza a paginar, la microSD se vuelve
# cuello y el SGBM/Hailo inference suben latencia → tracker pierde detecciones.
# Validado en piloto 2026-05-25: con working set ~300MB sostenido, swap usage
# = 0 bytes en 7 dias (vmstat si=so=0). Este sysctl asegura que SIGA en 0
# bajo carga ligeramente más alta.
vm.swappiness = 10

# Cap del dirty pagecache en bytes en lugar de % de RAM. El default
# vm.dirty_ratio=20 + dirty_background_ratio=10 en una Pi 5 4GB significa que
# pueden acumularse hasta 800 MB dirty antes del flush — un burst de fsync
# luego bloquea I/O por varios segundos. Con caps fijos el comportamiento es
# uniforme entre 2GB y 4GB y los flushes son frecuentes y chicos.
#
# 16 MB → background flush arranca temprano (writeback async, sin bloqueo).
vm.dirty_background_bytes = 16777216
# 64 MB → cap absoluto antes de bloqueo sync de los writes.
vm.dirty_bytes = 67108864
